    font-weight: 500;

  .producer-link {

  /* ---------- bottiglie segnate come bevute ---------- */
  .wine-row.is-bevuto {
    background: rgba(91, 107, 68, 0.07);
    opacity: 0.72;
  }
  :root[data-theme="dark"] .wine-row.is-bevuto { background: rgba(91, 107, 68, 0.12); }
  .wine-row.is-bevuto .wine-name { text-decoration: line-through; }
  .wine-row.is-bevuto:hover { opacity: 0.92; }
  .fav-btn { color: var(--text-soft); opacity: 0.45; filter: grayscale(1); display: inline-flex; align-items: center; justify-content: center; }
  .fav-btn:hover { opacity: 0.8; }
  .fav-btn.is-fav { opacity: 1; filter: none; border-color: var(--gold); animation: fav-sip-loop 2s ease-in-out infinite; }
  @keyframes fav-drink {
    0%   { transform: rotate(0deg) translateY(0); }
    15%  { transform: rotate(-18deg) translateY(-1px); }
    35%  { transform: rotate(-42deg) translateY(-2px); }
    50%  { transform: rotate(-48deg) translateY(-2px); }
    65%  { transform: rotate(-30deg) translateY(-1px); }
    85%  { transform: rotate(-8deg) translateY(0); }
    100% { transform: rotate(0deg) translateY(0); }
  }
  .fav-btn.drinking { animation: fav-drink 0.7s ease-in-out; }
  @keyframes fav-sip-loop {
    0%, 55%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(-14deg); }
    25% { transform: rotate(-22deg); }
    35% { transform: rotate(-12deg); }
    45% { transform: rotate(0deg); }
  }
  .sale-badge {
    background: var(--leaf);
    color: var(--parchment);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .cart-add-btn {
    border: 1px solid var(--leaf);
    color: var(--leaf);
    background: transparent;
    width: 30px; height: 30px;
    border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    flex: 0 0 auto;
  }
  .cart-add-btn:hover { background: rgba(91,107,68,0.12); }
  .cart-add-btn.in-cart { background: var(--leaf); color: var(--parchment); }
  .request-avail-btn {
    border: 1px solid var(--gold);
    color: var(--gold);
    background: transparent;
    width: 30px; height: 30px;
    border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    flex: 0 0 auto;
  }
  .request-avail-btn:hover { background: rgba(169,129,47,0.12); }

  /* ---------- pannello carrello ---------- */
  .cart-list { display: flex; flex-direction: column; gap: 14px; }
  .cart-item { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .cart-item-thumb {
    width: 44px; height: 44px; flex: 0 0 auto; border-radius: 3px;
    overflow: hidden; background: var(--parchment-deep);

  }
  .cart-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-item-thumb .thumb-icon { font-size: 1rem; opacity: 0.5; }
  .cart-item-info { flex: 1 1 auto; min-width: 0; }
  .cart-item-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.95rem; margin: 0; }
  .cart-item-meta { font-size: 0.78rem; color: var(--text-soft); margin: 2px 0; }
  .cart-item-price { font-size: 0.82rem; color: var(--leaf); font-weight: 600; margin: 0; }
  .cart-item-qty { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .qty-btn {
    width: 24px; height: 24px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 3px; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center;
  }
  .qty-btn:disabled { opacity: 0.4; }
  .cart-item-qty span { min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; }
  .cart-remove { background: none; border: none; color: var(--text-soft); font-size: 1.2rem; padding: 4px; line-height: 1; flex: 0 0 auto; }
  .cart-remove:hover { color: var(--wine); }
  .cart-total {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 1rem;
  }
  .cart-total strong { font-family: 'Fraunces', serif; color: var(--wine); }
  .bevuta-badge {
    background: var(--leaf);
    color: var(--parchment);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .panel.detail.is-bevuto { border-top-color: var(--leaf); }
  .panel.detail .panel-head h3 .bevuta-badge { vertical-align: middle; margin-left: 8px; }
  .bevuta-info { color: var(--text-soft); font-size: 0.88rem; margin: 0 0 12px; }
  .score-badge {
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .pos-badge {
    border: 1px solid var(--gold);
    color: var(--gold);
    background: transparent;
    font-size: 0.78rem;
    padding: 5px 9px;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pos-badge:hover { background: rgba(169,129,47,0.12); }

  .icon-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);
    width: 30px; height: 30px;
    border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    padding: 0;
    transition: border-color .15s ease, color .15s ease;
  }
  .icon-btn:hover { border-color: var(--wine); color: var(--wine); }

  /* inline edit / confirm states */
  .wine-right.editing, .wine-right.confirming {
    flex: 1 1 100%;
    flex-wrap: wrap;
    gap: 10px 14px;
    background: var(--parchment-deep);
    border: 1px dashed var(--gold);
    padding: 12px;
    border-radius: 3px;
    margin-top: 4px;
  }
  :root[data-theme="dark"] .wine-right.editing, :root[data-theme="dark"] .wine-right.confirming { background: rgba(169,129,47,0.08); }
  .f-label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 0.68rem;
    color: var(--text-soft);
    letter-spacing: 0.01em;
  }
  .f-input {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 2px;
    padding: 6px 8px;
    width: 9ch;
  }
  .f-input:focus { border-color: var(--wine); }
  select.f-input { width: auto; min-width: 11ch; padding-right: 20px; }
  .edit-actions { display: flex; align-items: flex-end; gap: 8px; margin-left: auto; }
  .save-btn, .confirm-yes {
    background: var(--wine);
    color: var(--parchment);
    border: 1px solid var(--wine);
    padding: 8px 14px;
    font-size: 0.82rem;
    border-radius: 2px;
    font-weight: 600;
  }
  .save-btn:hover, .confirm-yes:hover { background: var(--wine-bright); }
  .confirm-yes { background: #7A2020; border-color: #7A2020; }
  .cancel-btn {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--line);
    padding: 8px 14px;
    font-size: 0.82rem;
    border-radius: 2px;
  }
  .cancel-btn:hover { border-color: var(--text-soft); }
  .f-error {
    flex: 1 1 100%;
    color: #a3273a;
    font-size: 0.78rem;
    margin: 0;
  }
  .confirm-text { font-size: 0.88rem; color: var(--text); }

  /* toast + saving indicator */
  .toast {
    position: fixed;
    left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: var(--wine-dark);
    color: var(--parchment);
    border: 1px solid var(--gold);
    padding: 10px 18px;
    border-radius: 3px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.saving::after {
    content: "Salvataggio…";
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    background: var(--gold); color: var(--wine-dark);
    text-align: center; font-size: 0.78rem; padding: 4px;
    z-index: 300;
  }

  /* ---------- shelf map ---------- */
  .rack-wrap {

    background: var(--wood);
    border: 1px solid var(--line);
    padding: 22px;
    overflow-x: auto;
  }
  .rack {
    display: grid;
    grid-template-columns: 34px repeat(9, minmax(34px, 1fr));
    gap: 5px;
    min-width: 380px;
  }
  .rack-boxes {
    display: grid;
    grid-template-columns: 34px repeat(6, minmax(51px, 1.5fr));
    gap: 5px;
    min-width: 380px;
    margin-bottom: 14px;
  }
  .rack-box-spacer { }
  .rack-box {
    position: relative;
    aspect-ratio: 1.5 / 1;
    border: 1px solid rgba(244,234,218,0.25);
    background: rgba(244,234,218,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem;
    font-weight: 600;
    color: rgba(244,234,218,0.55);
    border-radius: 3px;
    transition: transform .12s ease;
  }
  .rack-box.filled {
    background: linear-gradient(160deg, var(--wine-bright), var(--wine-dark));
    color: var(--parchment);
    border-color: var(--gold-soft);
    cursor: pointer;
  }
  .rack-box.filled:hover { transform: scale(1.04); z-index: 2; }
  .rack-box.empty { cursor: default; }
  .rack-box-qty {
    position: absolute;
    bottom: 3px; right: 6px;
    font-size: 0.68rem;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }
  .rack .corner { }
  .rack .col-label, .rack .row-label {
    color: rgba(244,234,218,0.55);
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
  }
  .rack .row-label { justify-content: flex-end; padding-right: 4px; font-variant-numeric: tabular-nums;}
  .slot {
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(244,234,218,0.18);
    background: rgba(244,234,218,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    color: rgba(244,234,218,0.3);
    border-radius: 2px;
    transition: transform .12s ease, background .12s ease;
  }
  .slot.filled {
    background: linear-gradient(160deg, var(--wine-bright), var(--wine-dark));
    color: var(--parchment);
    border-color: var(--gold-soft);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .slot.filled:hover { transform: scale(1.08); z-index: 2; }
  .slot.empty { cursor: default; }
  .rack-legend {
    display: flex; align-items: center; gap: 18px;
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-soft);
    flex-wrap: wrap;
  }
  .rack-legend .sw { display: inline-flex; align-items: center; gap: 6px; }
  .sw-box { width: 14px; height: 14px; border-radius: 2px; display: inline-block; }

  /* ---------- calendario ---------- */
  .month-drunk-stat {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--wine);
    padding: 14px 20px;
    margin: 4px 0 20px;
    text-align: left;
  }
  .month-drunk-stat:hover { border-left-color: var(--gold); }
  .month-drunk-stat .n {
    font-family: 'Fraunces', serif; font-size: 1.8rem; color: var(--text); line-height: 1;
  }
  .month-drunk-stat .l { font-size: 0.82rem; color: var(--text-soft); margin-top: 3px; }

  .cal-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 10px 0 16px;
  }
  .cal-month-label {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 1.25rem;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-weekday {
    text-align: center; font-size: 0.72rem; color: var(--text-soft);
    padding-bottom: 6px;
  }
  .cal-cell {
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    font-size: 0.82rem;
    color: var(--text);
  }
  .cal-cell.empty { border-color: transparent; background: none; }
  .cal-cell.is-today { border-color: var(--gold); border-width: 2px; }
  .cal-cell.has-events { cursor: pointer; font-weight: 600; }
  .cal-cell.has-events:hover { border-color: var(--wine); background: var(--parchment-deep); }
  .cal-daynum { font-variant-numeric: tabular-nums; }
  .cal-dots { display: flex; gap: 3px; height: 6px; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-dot.opened { background: var(--wine-bright); }
  .cal-dot.closed { background: var(--leaf); }

  /* ---------- modalità Guest: nasconde/disabilita tutto ciò che scrive dati ---------- */
  body:not(.is-admin) .icon-btn:not(.fav-btn),
  body:not(.is-admin) #importBtn,
  body:not(.is-admin) #saveAllBtn,
  body:not(.is-admin) #notifEmailBtn,
  body:not(.is-admin) #msgCenterBtn,
  body:not(.is-admin) #detailMarkDrinkBtn,
  body:not(.is-admin) #detailRestoreBtn,
  body:not(.is-admin) .wine-right.confirming,
  body:not(.is-admin) .attach-upload,
  body:not(.is-admin) .attach-del {
    display: none !important;
  }

  body:not(.is-admin) .hero-photo {
    pointer-events: none;

  }
  body:not(.is-admin) .hero-photo-edit { display: none; }

  body:not(.is-admin) .panel select,
  body:not(.is-admin) .panel textarea,
  body:not(.is-admin) .wine-right.editing input,
  body:not(.is-admin) .wine-right.editing select {
    pointer-events: none;

  }

  /* ---------- vista geografica ---------- */
  .geo-maps { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 6px; }
  .geo-map-block { flex: 1 1 320px; min-width: 260px; }
  .geo-map-title {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 1.1rem; margin: 0 0 10px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .flag-icon {
    width: 22px; height: auto;
    border: 1px solid var(--line);
    border-radius: 2px;
    flex: 0 0 auto;
    display: block;
  }
  .geo-svg-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px;
  }

  .geo-region.has-wines { cursor: pointer; }
  .geo-region.has-wines:hover { opacity: 0.85; }
  .geo-badge { cursor: pointer; }
  .geo-badge circle { fill: var(--wine-dark); stroke: var(--gold-soft); stroke-width: 1; }

    fill: var(--parchment); font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 700;
  }

  /* ---------- slot panel / overlay ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,10,8,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .panel {
    background: var(--surface);
    color: var(--text);
    width: 100%; max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border-top: 3px solid var(--gold);
    border-radius: 3px;
  }
  .panel-body {
    padding: 16px 22px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    padding: 12px 22px;
    background: var(--surface);
    z-index: 5;
    border-bottom: 1px solid var(--line);
  }
  .panel h3 {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.4rem; margin: 0;
    flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel-head-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .save-all-btn {
    background: var(--wine);
    color: var(--parchment);
    border: 1px solid var(--wine);
    font-size: 1rem;
    width: 34px; height: 34px;
    padding: 0;
    border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .save-all-btn:hover { background: var(--wine-bright); }
  .panel .close-btn {
    background: none; border: none; color: var(--text-soft); font-size: 1.4rem; line-height: 1;
    padding: 0 0 0 8px;
  }
  .panel .sub { color: var(--text-soft); font-size: 0.85rem; margin-bottom: 18px; }
  .panel .wine-row:last-child { border-bottom: none; }

  /* ---------- wine detail card ---------- */
  .panel.detail { max-width: 560px; }
  .detail-thumb-row { display: flex; gap: 14px; align-items: flex-start; margin: 2px 0 18px; }
  .detail-thumb-row .thumb { width: 82px; height: 82px; flex: 0 0 auto; }
  .detail-facts p { margin: 0 0 5px; font-size: 0.88rem; color: var(--text-soft); }
  .detail-facts a { color: var(--wine); }
  .detail-facts a:hover { text-decoration: underline; }
  .price-fields { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .checkbox-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.88rem; color: var(--text);
    margin-top: 10px;
    cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--wine); }
  .vino-fields { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .giudizio-bevitore-field { margin-top: 12px; }
  .giudizio-bevitore-field textarea {
    width: 100%;
    font-family: 'Inter', sans-serif; font-size: 0.9rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 3px; padding: 8px 10px; resize: vertical;
  }
  .giudizio-bevitore-field .hint { color: var(--text-soft); font-size: 0.82rem; margin: 0 0 8px; }
  .slider-field { margin-bottom: 16px; }
  .slider-field:last-child { margin-bottom: 0; }
  .slider-field label {
    display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px;
  }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input[type="range"] {
    flex: 1 1 auto;
    accent-color: var(--wine);
  }
  .slider-row .slider-val {
    min-width: 3ch; text-align: right;
    font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--text-soft);
  }
  .detail-section { margin-top: 4px; padding-top: 18px; border-top: 1px solid var(--line); }
  .detail-section h4 {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 1.05rem; margin: 0 0 10px; color: var(--text);

  #detailNota {
    width: 100%;
    font-family: 'Inter', sans-serif; font-size: 0.9rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 3px; padding: 8px 10px; resize: vertical;
  }
  #detailNota:focus { border-color: var(--wine); }

<noscript>
  <section style="padding:24px; max-width:640px; margin:0 auto;">
    <h1>La Cantina di Egon</h1>
    <p>La mia cantina: catalogo online della cantina: vini suddivisi per tipologia, produttore, annata e regione, con la disponibilità delle bottiglie e la possibilità di richiedere i vini che ti interessano.</p>

<footer>Catalogo personale della cantina &middot; <a href="/privacy.html" style="color:inherit; text-decoration:underline;">Privacy</a></footer>
<div id="overlayRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  // =====================================================================
  // CONFIGURAZIONE — incolla qui i valori del tuo progetto Supabase
  // (Project Settings > API, nella dashboard di supabase.com)
  // =====================================================================
  const SUPABASE_URL = "https://xqhoznbjyoityjtrolzb.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_f_jswE7Sf0BU2hHKkQYuEg_ZT7e1rGh";
  const IMAGE_BUCKET = "etichette"; // nome del bucket di storage creato su Supabase
  const ATTACH_BUCKET = "allegati"; // bucket di storage per gli allegati PDF
  // =====================================================================

  const isConfigured = !SUPABASE_URL.startsWith("INSERISCI") && !SUPABASE_ANON_KEY.startsWith("INSERISCI");

  if (!isConfigured) {
    document.getElementById('app').innerHTML = `
      <div class="setup-screen">
        <h2>Configurazione richiesta</h2>
        <p>Questo sito si appoggia a un progetto Supabase gratuito per salvare bottiglie, foto e prezzi.
        Apri il file <code>index.html</code>, cerca "CONFIGURAZIONE" in cima allo script e inserisci
        l'URL e la chiave anon del tuo progetto (li trovi in Project Settings &rarr; API su supabase.com).
        Le istruzioni complete sono nel file README.md.</p>
      </div>`;
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  // ---- identità cliente / modalità Admin (Supabase Auth) ----
  // Il cliente entra inizialmente in modo anonimo, senza registrazione.
  // Quando vuole salvare la cantina, può trasformare questa sessione anonima
  // in un account permanente con la sola email: l'user_id non cambia. La password cliente è standard e interna al sito.
  const ADMIN_EMAIL = "admin.winecellar@aol.it";
  let isAdmin = false;
  let adminRole = null; // 'admin' | 'super_admin' (solo per la grafica: i permessi veri sono nel database)
  function isSuperAdmin() { return isAdmin && adminRole === 'super_admin'; }
  let currentUser = null;
  let userState = new Map();

  // Stato personale del cliente: preferiti, bottiglie bevute, date e giudizio
  // sono memorizzati per utente, mai sulla riga condivisa del catalogo.
  // Ruolo dell'account in tabella admin_users (ognuno legge solo la propria riga).
  // Se la tabella non esiste ancora, resta valido solo l'Admin originale (ADMIN_EMAIL).
  async function fetchAdminRole(email) {
    if (!email) return null;
    const mail = String(email).toLowerCase();
    try {
      const { data, error } = await sb.from('admin_users').select('role').eq('email', mail).maybeSingle();
      if (!error && data && data.role) return data.role;
    } catch (e) { /* tabella non disponibile */ }
    return mail === ADMIN_EMAIL.toLowerCase() ? 'admin' : null;
  }

  async function initUserSession() {
    try {
      const { data: sessionData } = await sb.auth.getSession();
      currentUser = sessionData && sessionData.session ? sessionData.session.user : null;
      // Il sito deve sempre aprirsi in modalità Guest: se la sessione salvata nel
      // browser è quella dell'Admin (da un accesso precedente non seguito da
      // "esci"), la scartiamo e ripartiamo da una sessione cliente anonima.
      if (currentUser && currentUser.email && await fetchAdminRole(currentUser.email)) {
        try { await sb.auth.signOut(); } catch (e2) { /* ignora */ }
        currentUser = null;
      }
      if (!currentUser) {
        const { data, error } = await sb.auth.signInAnonymously();
        if (error) throw error;
        currentUser = data && data.user ? data.user : null;
      }
      if (!currentUser) throw new Error('Impossibile creare la sessione cliente.');
      await loadUserState();
      updateAccountButton();
      return currentUser;
    } catch (e) {
      document.getElementById('app').innerHTML = `<div class="setup-screen"><h2>Accesso cliente non disponibile</h2><p>Supabase non permette di creare la sessione cliente anonima. Abilita <strong>Anonymous Sign-Ins</strong> in Authentication &rarr; Providers e verifica la tabella <code>wine_user_state</code>.</p><p class="f-error">${escHtml(e.message || e)}</p></div>`;
      throw e;
    }
  }

  async function loadUserState() {
    if (!currentUser) return;
    const { data, error } = await sb.from('wine_user_state').select('*').eq('user_id', currentUser.id);
    if (error) throw error;
    userState = new Map((data || []).map(r => [String(r.wine_id), r]));
    syncWinesWithUserState();
  }

  // Riallinea i campi personali dei vini (preferito, bevuto, date, giudizio)
  // con lo stato dell'utente attualmente collegato. Va richiamata ogni volta che
  // cambia l'utente (accesso, uscita), altrimenti restano i dati dell'utente precedente.
  function syncWinesWithUserState() {
    if (typeof WINES === 'undefined' || !Array.isArray(WINES) || !WINES.length) return;
    WINES.forEach(w => {
      const st = stateForWine(w.id);
      w.preferito = !!st.preferito;
      w.bevuto = !!st.bevuto;
      w.dataApertura = st.data_apertura || null;
      w.dataFine = st.data_fine || null;
      w.giudizioBevitore = st.giudizio_bevitore || '';
    });
    if (typeof rebuildIndexes === 'function') rebuildIndexes();
  }

  function stateForWine(id) {
    return userState.get(String(id)) || { preferito:false, bevuto:false, data_apertura:null, data_fine:null, giudizio_bevitore:'' };
  }

  async function saveUserWineState(id, patch) {
    if (!currentUser) throw new Error('Sessione cliente non disponibile.');
    if (patch && (patch.preferito !== undefined || patch.bevuto !== undefined)) maybeShowGuestHint();
    const existing = stateForWine(id);
    const row = {
      user_id: currentUser.id,
      wine_id: id,
      preferito: patch.preferito !== undefined ? !!patch.preferito : !!existing.preferito,
      bevuto: patch.bevuto !== undefined ? !!patch.bevuto : !!existing.bevuto,
      data_apertura: patch.data_apertura !== undefined ? patch.data_apertura : (existing.data_apertura || null),
      data_fine: patch.data_fine !== undefined ? patch.data_fine : (existing.data_fine || null),
      giudizio_bevitore: patch.giudizio_bevitore !== undefined ? (patch.giudizio_bevitore || '') : (existing.giudizio_bevitore || '')
    };
    const { data, error } = await sb.from('wine_user_state').upsert(row, { onConflict: 'user_id,wine_id' }).select().single();
    if (error) throw error;
    userState.set(String(id), data);
    return data;
  }


  // La quantità è un dato condiviso del catalogo (tabella wines): va scritta lì.
  // Salva sul catalogo condiviso (tabella wines) i campi modificabili dall'Admin.
  // Con le policy di sicurezza (RLS) Supabase NON restituisce errore quando una
  // modifica viene rifiutata: aggiorna 0 righe. Per questo chiediamo indietro le
  // righe modificate e, se non ce ne sono, segnaliamo l'errore invece di far
  // credere che il salvataggio sia riuscito.
  async function saveWineFields(id, fields) {
    if (!fields || !Object.keys(fields).length) return;
    const { data, error } = await sb.from('wines').update(fields).eq('id', id).select('id');
    if (error) throw error;
    if (!data || !data.length) {
      throw new Error('il database ha rifiutato la modifica (permessi insufficienti o vino non trovato). Riesegui l\'accesso Admin.');
    }
  }
  async function persistWineQuantity(id, newQty) {
    await saveWineFields(id, { quantita: newQty });
  }
  function drinkWarningText(w) {
    const q = Number(w.quantita) || 0;
    return q > 0
      ? `Proseguendo, la quantità verrà ridotta di 1 unità (da ${q} a ${q - 1}).`
      : 'La quantità è già 0 e resterà invariata.';
  }
  function restoreWarningText(w) {
    const q = Number(w.quantita) || 0;
    return `Proseguendo, la quantità verrà aumentata di 1 unità (da ${q} a ${q + 1}).`;
  }

  // Chiama la funzione customer-auth mostrando il VERO messaggio d'errore del server
  // (prima compariva solo "Edge Function returned a non-2xx status code").
  async function invokeCustomerAuth(body, fallbackMsg) {
    const { data, error } = await sb.functions.invoke('customer-auth', { body });
    let msg = null;
    let status = null;
    if (error) {
      status = error.context && error.context.status ? error.context.status : null;
      try {
        const j = await error.context.json();
        if (j && (j.error || j.message)) msg = j.error || j.message;
      } catch (e) { /* ignora */ }
    } else if (!data || !data.ok) {
      msg = (data && data.error) || null;
    } else {
      return data;
    }
    // Email già in uso: messaggio chiaro invece dell'errore tecnico.
    // "Error updating user" è la risposta generica di Supabase quando l'email non può
    // essere assegnata alla sessione, di solito perché appartiene già a un altro account.
    if (body.action === 'link' && (status === 409 || status === 422 || /already|registered|esist|duplic|in uso|exists|error updating user/i.test(msg || ''))) {
      throw new Error('Questa email non può essere usata: probabilmente è già registrata. Premi «Hai già un account? Accedi» oppure inserisci un\'altra email.');
    }
    throw new Error((msg || fallbackMsg) + (status ? ' (codice ' + status + ')' : ''));
  }

  // Chiama submit-request mostrando il messaggio vero del server (per esempio
  // "Troppe richieste") invece dell'errore tecnico generico.
  async function invokeSubmitRequest(body) {
    const { data, error } = await sb.functions.invoke('submit-request', { body });
    if (error) {
      let msg = null;
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) { /* ignora */ }
      throw new Error(msg || 'Invio non riuscito.');
    }
    if (!data || !data.ok) throw new Error((data && data.error) || 'Invio non riuscito.');
    return data;
  }

  function isAnonymousCustomer() {
    // Supabase può lasciare is_anonymous=true anche dopo un collegamento riuscito
    // via admin.updateUserById (comportamento noto/non garantito). Ciò che conta
    // davvero per noi è se l'utente ha un'email con cui può riaccedere.
    return !(currentUser && currentUser.email);
  }

  function updateLoggedBanner() {
    const el = document.getElementById('loggedBanner');
    const status = document.getElementById('accountStatus');
    const email = currentUser && currentUser.email;
    let label = 'Sei collegato come ospite';
    if (isAdmin) label = 'Sei collegato come amministratore';
    else if (email) label = 'Sei collegato come ' + email;
    if (status) status.textContent = label;
    // Mantiene aggiornato anche il banner preesistente, se presente.
    if (el) {
      if (email && email !== ADMIN_EMAIL && !isAdmin) {
        el.textContent = '✓ ' + label;
        el.hidden = false;
      } else {
        el.hidden = true;
        el.textContent = '';
      }
    }

  // Promemoria per gli ospiti: compare UNA SOLA VOLTA, alla prima modifica di un dato
  // (preferito, carrello...) fatta senza essere collegati con una email.
  const GUEST_HINT_KEY = 'cantina_guest_hint_done';
  function maybeShowGuestHint() {
    if (isAdmin || !isAnonymousCustomer()) return;
    let done = false;
    try { done = localStorage.getItem(GUEST_HINT_KEY) === '1'; } catch (e) { /* ignora */ }
    if (done) return;
    try { localStorage.setItem(GUEST_HINT_KEY, '1'); } catch (e) { /* ignora */ }
    let el = document.getElementById('guestHint');
    if (!el) {
      el = document.createElement('div');
      el.id = 'guestHint';
      el.className = 'guest-hint';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.innerHTML = `
        <div class="guest-hint-card">
          <h3>&#128161; Stai usando il sito come ospite</h3>
          <p>Preferiti, carrello e bottiglie bevute restano <strong>solo su questo dispositivo</strong> e si perdono se esci o cancelli i dati del browser.</p>
          <p>Per memorizzare le tue impostazioni e ritrovarle ogni volta, <strong>entra con la tua email</strong>.</p>
          <div class="guest-hint-actions">
            <button type="button" id="guestHintOpen" class="save-btn">Entra con la mia email</button>
            <button type="button" id="guestHintClose" class="cancel-btn">Continua come ospite</button>
          </div>
        </div>`;
      document.body.appendChild(el);
      document.getElementById('guestHintOpen').onclick = () => { hideGuestHint(); openCustomerAccountModal(); };
      document.getElementById('guestHintClose').onclick = (e) => {
        e.preventDefault(); e.stopPropagation();
        hideGuestHint();
        // Continua come ospite: annulla il passaggio corrente tornando alla pagina precedente.
        if (window.history.length > 1) window.history.back();
      };
      el.addEventListener('click', (e) => { if (e.target === el) hideGuestHint(); });
    }
    el.style.display = 'flex';
    el.hidden = false;
  }
  function hideGuestHint() {
    const el = document.getElementById('guestHint');
    if (el) { el.hidden = true; el.style.display = 'none'; }
  }

  function updateAccountButton() {
    updateLoggedBanner();

    if (isAnonymousCustomer()) {

    const close = () => closeOverlay();

        try {

          try { localStorage.removeItem(GUEST_HINT_KEY); } catch (e) { /* ignora */ }
          bevutoFilter = 'tutte'; onlyFavorites = false; currentQuery = '';
          const sBox = document.getElementById('searchBox');
          const sClear = document.getElementById('searchClear');
          if (sBox) sBox.value = '';
          if (sClear) sClear.hidden = true;
          syncWinesWithUserState();

          try {

            await loadCartFromDb();
          } catch (e) { /* ignora */ }
          syncWinesWithUserState();
          updateCartBadge();
          updateAccountButton();
          closeOverlay();
          showToast('Sei uscito da questo dispositivo.');
          refreshCurrentView();
          setSaving(false);

  function openCustomerLoginModal() {
    const root = document.getElementById('overlayRoot');
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel" style="max-width:400px;">
          <div class="panel-head">
            <h3>Accedi alla tua cantina</h3>
            <button class="close-btn" id="closeCustomerLoginBtn" aria-label="Chiudi">&times;</button>
          </div>
          <div class="panel-body">
            <p class="sub" style="margin-bottom:14px;">Inserisci l'email con cui hai salvato la tua cantina.</p>
            <label class="f-label" style="display:block;">Email
              <input type="email" id="loginCustomerEmail" class="f-input" style="width:100%;" autocomplete="email">
            </label>
            <div class="edit-actions" style="margin-left:0; margin-top:14px;">
              <button id="customerLoginBtn" class="save-btn">Accedi</button>
              <button class="cancel-btn" id="cancelCustomerLoginBtn">Annulla</button>
            </div>
            <p class="f-error" id="customerLoginError" hidden></p>
          </div>
        </div>
      </div>`;
    const close = () => closeOverlay();
    document.getElementById('closeCustomerLoginBtn').onclick = close;
    document.getElementById('cancelCustomerLoginBtn').onclick = close;
    document.getElementById('overlayBg').addEventListener('click', e => { if (e.target.id === 'overlayBg') close(); });
    const emailInput = document.getElementById('loginCustomerEmail');
    const errEl = document.getElementById('customerLoginError');
    const doLogin = async () => {
      const email = emailInput.value.trim().toLowerCase();
      errEl.hidden = true;
      if (!isValidEmail(email)) { errEl.textContent = 'Inserisci un indirizzo email valido.'; errEl.hidden = false; return; }
      setSaving(true);
      try {
        await sb.auth.signOut();
        // La password standard non viene mai inviata o conservata nel browser.
        // La Edge Function la recupera dal secret server-side e autentica il cliente.
        const data = await invokeCustomerAuth({ action: 'login', email }, 'Accesso non riuscito.');
        if (!data.session) throw new Error('Accesso non riuscito.');
        const { error: sessionError } = await sb.auth.setSession(data.session);
        if (sessionError) throw sessionError;
        currentUser = data.session.user || null;
        if (!currentUser) throw new Error("Impossibile recuperare l-account.");
        await loadUserState();
        await loadCartFromDb();
        updateCartBadge();
        updateAccountButton();
        closeOverlay();
        showToast('Bentornato nella tua cantina.');
        refreshCurrentViewPreservingScroll();
      } catch (e) {
        try { await initUserSession(); await loadCartFromDb(); updateCartBadge(); } catch (_) {}
        errEl.textContent = e.message || 'Accesso non riuscito.';
        errEl.hidden = false;
      } finally {
        setSaving(false);
      }
    };
    document.getElementById('customerLoginBtn').onclick = doLogin;
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    emailInput.focus();
  }

  // ---- invio email (richieste di disponibilità, carrello, supporto) ----
  // L'invio vero e proprio avviene ora nella Edge Function "submit-request":
  // il browser non conosce più nessuna chiave EmailJS (né pubblica né privata).
  const DEFAULT_SITE_TITLE = 'La cantina di Egon';
  const SITE_BUILD = '2026-10-07 r10';
  const DEFAULT_REQUEST_LIMIT = 5;
  let requestLimit = DEFAULT_REQUEST_LIMIT;
  async function loadRequestLimit() {
    try {
      const { data, error } = await sb.from('site_settings').select('value').eq('key', 'request_limit_per_hour').maybeSingle();
      const n = !error && data ? parseInt(data.value, 10) : NaN;
      requestLimit = (n >= 1 && n <= 200) ? n : DEFAULT_REQUEST_LIMIT;
    } catch (e) { requestLimit = DEFAULT_REQUEST_LIMIT; }
  }
  let siteTitle = null;
  async function loadSiteTitle() {
    try {
      const { data, error } = await sb.from('site_settings').select('value').eq('key', 'site_title').maybeSingle();
      if (!error && data && data.value) siteTitle = data.value;
    } catch (e) { /* ignora */ }
    applySiteTitle();
  }
  function applySiteTitle() {
    updateSeo();
  }

  // ---- SEO: titolo, descrizione e dati strutturati aggiornati con i dati reali ----
  // Nei dati strutturati vanno SOLO informazioni pubbliche (mai prezzi, quantità, note o scaffali).
  function seoWineName(w) {
    return [w.cantina, w.nome || w.tipo, w.annata].filter(Boolean).join(' ');
  }
  function seoWineDescription(w) {
    const parts = [];
    const kind = ['Vino', w.coloreVino].filter(Boolean).join(' ');
    parts.push(kind);
    if (w.effervescenza) parts.push(w.effervescenza);
    if (w.dolcezza) parts.push(w.dolcezza);
    if (w.tipo && w.nome) parts.push(w.tipo);
    const where = [w.regione, w.paese].filter(Boolean).join(', ');
    let txt = parts.join(', ');
    if (where) txt += ' – ' + where;
    if (w.grado) txt += ' – ' + String(w.grado).replace('.', ',') + '% vol.';
    return txt;
  }
  function updateSeo() {
    try {
      const baseTitle = siteTitle || DEFAULT_SITE_TITLE;
      const fullTitle = baseTitle + ' – Catalogo vini e produttori';
      document.title = fullTitle;
      const list = (typeof WINES !== 'undefined' && Array.isArray(WINES)) ? WINES : [];
      const nCantine = new Set(list.map(w => w.cantina).filter(Boolean)).size;
      const desc = (list.length && nCantine)
        ? `Catalogo della cantina con ${list.length} etichette di ${nCantine} produttori: tipologie, annate, regioni e disponibilità delle bottiglie. Richiedi i tuoi vini preferiti.`
        : 'Catalogo della cantina: tipologie, produttori, annate, regioni e disponibilità delle bottiglie. Richiedi la disponibilità dei tuoi vini preferiti.';
      const setContent = (sel, v) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', v); };
      setContent('meta[name="description"]', desc);
      setContent('meta[property="og:title"]', fullTitle);
      setContent('meta[name="twitter:title"]', fullTitle);
      setContent('meta[property="og:site_name"]', baseTitle);
      setContent('meta[property="og:description"]', desc);
      setContent('meta[name="twitter:description"]', desc);

      if (/^https?:$/.test(location.protocol)) {
        const can = document.getElementById('seoCanonical');
        if (can && !can.getAttribute('href')) {
          const url = location.origin + location.pathname;
          can.setAttribute('href', url);
          setContent('#seoOgUrl', url);
        }
      }

      // elenco dei vini per i motori di ricerca (massimo 150 voci)
      let ld = document.getElementById('seoWines');
      if (!ld) {
        ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.id = 'seoWines';
        document.head.appendChild(ld);
      }
      const items = list.slice(0, 150).map((w, i) => ({
        '@type': 'ListItem',
        position: i + 1,
        item: {
          '@type': 'Product',
          name: seoWineName(w),
          brand: { '@type': 'Brand', name: w.cantina || baseTitle },
          category: 'Vino',
          description: seoWineDescription(w),
        },
      }));
      ld.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        name: 'Catalogo vini – ' + baseTitle,
        numberOfItems: items.length,
        itemListElement: items,
      }).replace(/</g, '\\u003c');
    } catch (e) { /* il SEO non deve mai bloccare il sito */ }
  }
  // Salva una impostazione generale e verifica che il database l'abbia accettata.
  async function saveSiteSetting(key, value) {
    const { data, error } = await sb.from('site_settings').upsert({ key, value }).select('key');
    if (error) throw error;
    if (!data || !data.length) throw new Error('il database ha rifiutato la modifica (permessi insufficienti).');
  }
  let notificationEmail = null;
  async function loadNotificationEmail() {
    if (!isAdmin) return;
    try {
      const { data, error } = await sb.from('site_settings').select('value').eq('key', 'admin_notification_email').maybeSingle();
      if (!error && data && data.value) notificationEmail = data.value;
    } catch (e) { /* ignora */ }
  }

  // ---- carrello personale del cliente ----
  // Il carrello è persistito in Supabase per user_id, con localStorage
  // usato solo come cache locale. In questo modo due clienti non condividono
  // mai il carrello e lo stesso cliente può ritrovarlo anche su un altro device.
  let cart = {};
  let cartLoadedFromDb = false;
  function cartStorageKey() { return currentUser ? 'cantina_cart_' + currentUser.id : 'cantina_cart_pending'; }
  function loadCartFromStorage() {
    try {
      const raw = localStorage.getItem(cartStorageKey());
      cart = raw ? JSON.parse(raw) : {};
    } catch (e) { cart = {}; }
  }
  function saveCartToStorage() {
    try { localStorage.setItem(cartStorageKey(), JSON.stringify(cart)); } catch (e) { /* ignora */ }
  }
  async function loadCartFromDb() {
    if (!currentUser) return;
    const { data, error } = await sb.from('wine_user_cart').select('wine_id, quantity').eq('user_id', currentUser.id);
    if (error) throw error;
    cart = {};
    (data || []).forEach(row => {
      const id = String(row.wine_id);
      const qty = Number(row.quantity) || 0;
      if (qty > 0) cart[id] = qty;
    });
    cartLoadedFromDb = true;
    saveCartToStorage();
  }
  async function persistCartItem(id) {
    maybeShowGuestHint();
    if (!currentUser || !cartLoadedFromDb) return;
    const qty = Number(cart[id] || 0);
    try {
      if (qty <= 0) {
        const { error } = await sb.from('wine_user_cart').delete().eq('user_id', currentUser.id).eq('wine_id', id);
        if (error) throw error;
      } else {
        const { error } = await sb.from('wine_user_cart').upsert({
          user_id: currentUser.id, wine_id: id, quantity: qty
        }, { onConflict: 'user_id,wine_id' });
        if (error) throw error;
      }
    } catch (e) {
      showToast('Impossibile salvare il carrello: ' + (e.message || e));
    }
  }
  async function clearCartFromDb() {
    if (!currentUser || !cartLoadedFromDb) return;
    const { error } = await sb.from('wine_user_cart').delete().eq('user_id', currentUser.id);
    if (error) throw error;
  }
  function cartCount() {
    return Object.values(cart).reduce((a, b) => a + b, 0);
  }
  function cartPriceFor(w) {
    if (w.valoreMercato !== null && w.valoreMercato !== undefined) return w.valoreMercato;
    if (w.prezzo !== null && w.prezzo !== undefined) return w.prezzo;
    return 0;
  }
  function cartTotal() {
    let total = 0;
    Object.keys(cart).forEach(id => {
      const w = byId.get(id);
      if (!w) return;
      total += cartPriceFor(w) * cart[id];
    });
    return total;
  }
  function updateCartBadge() {
    const badge = document.getElementById('cartBadge');
    if (!badge) return;
    const count = cartCount();
    badge.textContent = count;
    badge.hidden = count === 0;
  }
  function refreshCartAddButton(id) {
    const btn = document.querySelector(`.cart-add-btn[data-id="${id}"]`);
    if (!btn) return;
    const qty = cart[id] || 0;
    if (qty > 0) {
      btn.classList.add('in-cart');
      btn.title = `${qty} nel carrello — aggiungi ancora`;
      btn.innerHTML = `&#128722;<span style="margin-left:3px;font-size:0.72rem;">${qty}</span>`;
    } else {
      btn.classList.remove('in-cart');
      btn.title = 'Aggiungi al carrello';
      btn.innerHTML = '&#128722;';
    }
  }
  function addToCart(id) {
    const w = byId.get(id);
    if (!w || !w.disponibileVendita) return;
    const current = cart[id] || 0;
    if (current >= w.quantita) { showToast('Hai già aggiunto tutte le bottiglie disponibili di questo vino.'); return; }
    cart[id] = current + 1;
    saveCartToStorage();
    void persistCartItem(id);
    updateCartBadge();
    refreshCartAddButton(id);
    showToast('Aggiunto al carrello.');
  }
  function openCartPanel() {
    const ids = Object.keys(cart).filter(id => cart[id] > 0 && byId.get(id));
    const root = document.getElementById('overlayRoot');
    if (!ids.length) {
      root.innerHTML = `
        <div class="overlay" id="overlayBg">
          <div class="panel">
            <div class="panel-head">
              <h3>&#128722; Il tuo carrello</h3>
              <button class="close-btn" id="closeCartBtn" aria-label="Chiudi">&times;</button>
            </div>
            <div class="panel-body">
              <p class="empty-hint">Il carrello è vuoto. Aggiungi qualche vino tra quelli disponibili alla vendita.</p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('closeCartBtn').onclick = closeOverlay;
      document.getElementById('overlayBg').addEventListener('click', (e) => { if (e.target.id === 'overlayBg') closeOverlay(); });
      return;
    }
    const itemsHtml = ids.map(id => {
      const w = byId.get(id);
      const price = cartPriceFor(w);
      const qty = cart[id];
      return `
        <div class="cart-item" data-id="${id}">
          <div class="cart-item-thumb">${thumbHtml(w)}</div>
          <div class="cart-item-info">
            <p class="cart-item-name">${escHtml(fmtName(w))}</p>
            <p class="cart-item-meta">${escHtml(fmtCantina(w.cantina))} &middot; ${w.annata}</p>
            <p class="cart-item-price">${fmtPrice(price) || '&ndash;'} cad.</p>
          </div>
          <div class="cart-item-qty">
            <button class="qty-btn cart-dec" data-id="${id}" aria-label="Diminuisci">&minus;</button>
            <span>${qty}</span>
            <button class="qty-btn cart-inc" data-id="${id}" aria-label="Aumenta" ${qty >= w.quantita ? 'disabled' : ''}>&plus;</button>
          </div>
          <button class="cart-remove" data-id="${id}" title="Rimuovi dal carrello" aria-label="Rimuovi dal carrello">&times;</button>
        </div>
      `;
    }).join('');
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel">
          <div class="panel-head">
            <h3>&#128722; Il tuo carrello</h3>
            <button class="close-btn" id="closeCartBtn" aria-label="Chiudi">&times;</button>
          </div>
          <div class="panel-body">
            <div class="cart-list">${itemsHtml}</div>
            <div class="cart-total">
              <span>Totale stimato</span>
              <strong>${fmtPrice(cartTotal()) || '&euro; 0,00'}</strong>
            </div>
            <button id="cartClearBtn" class="cancel-btn" style="width:100%; margin-top:12px;">Svuota carrello</button>

            <div class="detail-section" style="margin-top:18px; padding-top:16px; border-top:1px solid var(--line);">
              <h4>Conferma la richiesta</h4>
              <p class="sub" style="margin-bottom:10px;">Email e telefono sono entrambi obbligatori: ti contatteremo per concludere.</p>
              <label class="f-label" style="display:block;">Email<input type="email" id="cartEmail" class="f-input" style="width:100%;" placeholder="nome@esempio.it"></label>
              <label class="f-label" style="display:block; margin-top:10px;">Telefono<input type="tel" id="cartPhone" class="f-input" style="width:100%;" placeholder="+39 ..."></label>
              <div class="edit-actions" style="margin-left:0; margin-top:14px;">
                <button id="cartConfirmBtn" class="save-btn">Conferma richiesta</button>
              </div>
              <p class="f-error" id="cartConfirmError" hidden></p>
            </div>

            <p class="empty-hint" style="margin-top:14px; margin-bottom:0;">Confermando, riceverai conferma via email a breve da parte di chi cura la cantina.</p>
          </div>
        </div>
      </div>
    `;
    document.getElementById('closeCartBtn').onclick = closeOverlay;
    document.getElementById('overlayBg').addEventListener('click', (e) => { if (e.target.id === 'overlayBg') closeOverlay(); });
    document.getElementById('cartClearBtn').onclick = async () => {
      const clearedIds = Object.keys(cart);
      cart = {};
      saveCartToStorage();
      try { await clearCartFromDb(); } catch (e) { showToast('Impossibile svuotare il carrello: ' + (e.message || e)); }
      updateCartBadge();
      clearedIds.forEach(refreshCartAddButton);
      openCartPanel();
    };
    document.getElementById('cartConfirmBtn').onclick = async (ev) => {
      ev.stopPropagation();
      const emailVal = document.getElementById('cartEmail').value.trim();
      const phoneVal = document.getElementById('cartPhone').value.trim();
      const errEl = document.getElementById('cartConfirmError');
      errEl.hidden = true;

      if (!emailVal || !phoneVal) {
        errEl.textContent = 'Email e telefono sono entrambi obbligatori.';
        errEl.hidden = false;
        return;
      }
      if (!isValidEmail(emailVal)) {
        errEl.textContent = 'L\'indirizzo email non sembra valido.';
        errEl.hidden = false;
        return;
      }
      if (!isValidPhone(phoneVal)) {
        errEl.textContent = 'Il numero di telefono non sembra valido.';
        errEl.hidden = false;
        return;
      }

      const itemsPayload = ids.map(id => ({ wine_id: id, quantity: cart[id] }));

      setSaving(true);
      try {
        await invokeSubmitRequest({ type: 'cart', email: emailVal, phone: phoneVal, items: itemsPayload });
        const confirmedIds = Object.keys(cart);
        cart = {};
        saveCartToStorage();
        await clearCartFromDb();
        updateCartBadge();
        confirmedIds.forEach(refreshCartAddButton);
        closeOverlay();
        showToast('Richiesta confermata. Verrai ricontattato a breve.');
      } catch (e) {
        errEl.textContent = 'Invio non riuscito: ' + (e.message || e);
        errEl.hidden = false;
      } finally {
        setSaving(false);
      }
    };
    root.querySelectorAll('.cart-inc').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const w = byId.get(id);
        if (!w) return;
        if ((cart[id] || 0) < w.quantita) { cart[id] = (cart[id] || 0) + 1; saveCartToStorage(); await persistCartItem(id); updateCartBadge(); refreshCartAddButton(id); openCartPanel(); }
      };
    });
    root.querySelectorAll('.cart-dec').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        cart[id] = Math.max(0, (cart[id] || 0) - 1);
        if (cart[id] === 0) delete cart[id];
        saveCartToStorage();
        await persistCartItem(id);
        updateCartBadge();
        refreshCartAddButton(id);
        openCartPanel();
      };
    });
    root.querySelectorAll('.cart-remove').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        delete cart[id];
        saveCartToStorage();
        await persistCartItem(id);
        updateCartBadge();
        refreshCartAddButton(id);
        openCartPanel();
      };
    });
  }


  async function initAdminState() {
    // L'eventuale sessione Admin salvata è già stata scartata da initUserSession():

  function renderAdminLink() {
    const el = document.getElementById('adminToggleBtn');
    if (!el) return;
    el.textContent = isAdmin ? (adminRole === 'super_admin' ? 'Super Admin ✓ (esci)' : 'Admin ✓ (esci)') : 'Admin';
    el.classList.toggle('is-admin-active', isAdmin);

  function openAdminModal() {
    const root = document.getElementById('overlayRoot');
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel" style="max-width:360px;">
          <div class="panel-head">
            <h3>Accesso Admin</h3>
            <button class="close-btn" id="closeAdminBtn" aria-label="Chiudi">&times;</button>
          </div>
          <div class="panel-body">
            <label class="f-label" style="display:block;">Password
              <input type="password" id="adminPasswordInput" class="f-input" style="width:100%;" autocomplete="current-password">
            </label>
            <div class="edit-actions" style="margin-left:0; margin-top:14px;">
              <button id="adminLoginBtn" class="save-btn">Entra</button>
              <button class="cancel-btn" id="cancelAdminBtn">Annulla</button>
            </div>
            <p class="f-error" id="adminError" hidden>Password errata.</p>
          </div>
        </div>
      </div>
    `;
    const close = () => closeOverlay();
    document.getElementById('closeAdminBtn').onclick = close;
    document.getElementById('cancelAdminBtn').onclick = close;
    document.getElementById('overlayBg').addEventListener('click', (e) => {
      if (e.target.id === 'overlayBg') close();
    });
    const pwInput = document.getElementById('adminPasswordInput');
    pwInput.focus();
    const doLogin = async () => {
      const pw = pwInput.value;
      const errEl = document.getElementById('adminError');
      if (errEl) errEl.hidden = true;
      if (!pw) return;
      setSaving(true);
      try {
        // Il server (funzione admin-login) capisce da solo a quale amministratore
        // corrisponde la password e di che tipo è (Admin o Super Admin).
        let role = null;
        let fnMissing = false;
        const { data: lg, error: lgErr } = await sb.functions.invoke('admin-login', { body: { password: pw } });
        if (lgErr) {
          const status = lgErr.context && lgErr.context.status;
          if (status === undefined || status === 404) {
            fnMissing = true; // funzione non ancora pubblicata o non raggiungibile
          } else {
            let msg = 'Password errata.';
            try { const j = await lgErr.context.json(); if (j && j.error) msg = j.error; } catch (e2) { /* ignora */ }
            throw new Error(msg);
          }
        } else {
          if (!lg || !lg.ok || !lg.session) throw new Error((lg && lg.error) || 'Password errata.');
          const { error: sesErr } = await sb.auth.setSession({
            access_token: lg.session.access_token, refresh_token: lg.session.refresh_token
          });
          if (sesErr) throw sesErr;
          role = lg.role;
        }
        if (fnMissing) {
          // Compatibilità: finché admin-login non è pubblicata, accesso come Admin standard.
          const { error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: pw });
          if (error) throw new Error('Password errata.');
          role = await fetchAdminRole(ADMIN_EMAIL);
        }
        if (!role) {
          try { await sb.auth.signOut(); } catch (e2) { /* ignora */ }
          try { await initUserSession(); await loadCartFromDb(); updateCartBadge(); } catch (e3) { /* ignora */ }
          throw new Error('Password errata.');
        }
        adminRole = role;
        isAdmin = true;
        document.body.classList.add('is-admin');
        renderAdminLink();
        try {
          const { data: sessionData } = await sb.auth.getSession();
          currentUser = sessionData && sessionData.session ? sessionData.session.user : currentUser;
          await loadUserState();
          await loadWines();
          await loadCartFromDb();
          updateCartBadge();
          updateAccountButton();
        } catch (stateErr) {
          showToast('Accesso riuscito, ma impossibile caricare il tuo stato personale: ' + (stateErr.message || stateErr));
        }
        closeOverlay();
        showToast(adminRole === 'super_admin' ? 'Modalità Super Admin attiva.' : 'Modalità Admin attiva.');
        refreshCurrentViewPreservingScroll();
      } catch (e) {
        if (errEl) { errEl.textContent = (e && e.message) || 'Password errata.'; errEl.hidden = false; }
      } finally {
        setSaving(false);
      }
    };
    document.getElementById('adminLoginBtn').onclick = doLogin;
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  }

  async function adminLogout() {
    try { await sb.auth.signOut(); } catch (e) { /* ignora */ }
    isAdmin = false;
    adminRole = null;
    document.body.classList.remove('is-admin');
    renderAdminLink();
    try {
      await initUserSession();
      await loadCartFromDb();
      updateCartBadge();
    } catch (e) {}
    updateAccountButton();
    showToast('Uscito dalla modalità Admin.');
    refreshCurrentViewPreservingScroll();
  }

  // Una posizione è o una coordinata numerica scaffale.posto (es. 3.4),
  // o una delle 6 etichette Box1..Box6 (non legate a uno scaffale fisso).
  function normalizeBoxLabel(p) {
    const m = String(p == null ? '' : p).trim().match(/^box\s*([1-6])$/i);
    return m ? 'Box' + m[1] : null;
  }
  function posKey(p) {
    const box = normalizeBoxLabel(p);
    if (box) return box.toLowerCase();
    return Number(p).toFixed(1);
  }
  function posSortValue(p) {
    const box = normalizeBoxLabel(p);
    if (box) return 1000 + parseInt(box.slice(3), 10);
    return Number(p);
  }
  function posLabel(p) {
    const box = normalizeBoxLabel(p);
    if (box) return box;
    const n = Number(p);
    const shelf = Math.floor(n);
    const slot = Math.round((n - shelf) * 10);
    return "Scaffale " + shelf + " &middot; pos. " + slot;
  }
  function posShort(p) {
    const box = normalizeBoxLabel(p);
    if (box) return box;
    const n = Number(p);
    const shelf = Math.floor(n);
    const slot = Math.round((n - shelf) * 10);
    return shelf + "." + slot;
  }
  function parsePos(str) {
    const box = normalizeBoxLabel(str);
    if (box) return box;
    const m = String(str).trim().match(/^([1-9])\.?([1-9])$/);
    if (!m) return null;
    return parseFloat(m[1] + '.' + m[2]);
  }

  // ---- formato / grado ----
  const FORMATO_OPTIONS = ["0,750 lt.", "1,5 lt.", "3 lt.", "4 lt.", "5 lt.", "7 lt.", "9 lt."];
  const DEFAULT_FORMATO = FORMATO_OPTIONS[0];
  const GRADO_OPTIONS = [];
  for (let i = 20; i <= 40; i++) GRADO_OPTIONS.push(i / 2); // 10, 10.5, ... 20

  function fmtGrado(g) {
    if (g === null || g === undefined || g === '') return null;
    const n = Number(g);
    if (isNaN(n)) return null;
    const s = Number.isInteger(n) ? String(n) : String(n).replace('.', ',');
    return s + '&deg;';
  }

  function normalizeFormato(v) {
    if (!v) return DEFAULT_FORMATO;
    const s = String(v).trim().toLowerCase();
    const match = FORMATO_OPTIONS.find(o => o.toLowerCase() === s);
    return match || DEFAULT_FORMATO;
  }
  function normalizeOption(v, options) {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    const match = options.find(o => o.toLowerCase() === s);
    return match || null;
  }
  function parseBoolCell(v) {
    if (v === null || v === undefined || v === '') return false;
    if (typeof v === 'boolean') return v;
    const s = String(v).trim().toLowerCase();
    return s === 'si' || s === 'sì' || s === 'yes' || s === 'true' || s === '1' || s === 'x';
  }
  function parseDateCell(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) {
      return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
    }
    if (typeof v === 'number') {
      try {
        const d = XLSX.SSF.parse_date_code(v);
        if (d) return d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0');
      } catch (e) { /* ignora, proviamo come testo */ }
      return null;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    return null;
  }

  // ---- sorting ----
  let sortField = 'nome';
  let sortDir = 'asc';

  const GROUP_FIELDS = [
    ['nessuno', 'Nessun raggruppamento'], ['cantina', 'Fornitore (cantina)'], ['tipo', 'Tipologia'],
    ['formato', 'Formato'], ['colore', 'Colore vino'], ['effervescenza', 'Caratteristica vino']
  ];
  function groupKeyFor(w, field) {
    switch (field) {
      case 'cantina': return fmtCantina(w.cantina);
      case 'tipo': return fmtType(w.tipo);
      case 'formato': return w.formato || DEFAULT_FORMATO;
      case 'colore': return w.coloreVino || 'Colore non specificato';
      case 'effervescenza': return w.effervescenza || 'Non specificato';
      default: return null;
    }
  }
  const SORT_FIELDS = [
    ['nome', 'Nome'], ['cantina', 'Cantina'], ['tipo', 'Tipologia'], ['annata', 'Annata'],
    ['quantita', 'Quantità'], ['formato', 'Formato'], ['grado', 'Grado'],
    ['prezzo', 'Prezzo'], ['posizione', 'Scaffale'], ['giudizio', 'Giudizio complessivo']
  ];
  function compareBy(field) {
    switch (field) {
      case 'nome': return (a, b) => fmtName(a).localeCompare(fmtName(b), 'it');
      case 'cantina': return (a, b) => fmtCantina(a.cantina).localeCompare(fmtCantina(b.cantina), 'it');
      case 'tipo': return (a, b) => fmtType(a.tipo).localeCompare(fmtType(b.tipo), 'it');
      case 'annata': return (a, b) => a.annata - b.annata;
      case 'quantita': return (a, b) => a.quantita - b.quantita;
      case 'formato': return (a, b) => (a.formato || '').localeCompare(b.formato || '', 'it');
      case 'grado': return (a, b) => (a.grado === null || a.grado === undefined ? -1 : a.grado) - (b.grado === null || b.grado === undefined ? -1 : b.grado);
      case 'prezzo': return (a, b) => (a.prezzo === null || a.prezzo === undefined ? -1 : a.prezzo) - (b.prezzo === null || b.prezzo === undefined ? -1 : b.prezzo);
      case 'posizione': return (a, b) => posSortValue(a.posizione) - posSortValue(b.posizione);
      case 'giudizio': return (a, b) => (a.giudizioComplessivo === null || a.giudizioComplessivo === undefined ? -1 : a.giudizioComplessivo) - (b.giudizioComplessivo === null || b.giudizioComplessivo === undefined ? -1 : b.giudizioComplessivo);
      default: return () => 0;
    }
  }
  function sortBarHtml() {
    const filterOpts = [['tutte', 'Tutte'], ['no', 'Solo disponibili'], ['si', 'Solo bevute']];
    return `
      <div class="sort-bar">

        <select id="groupBySel">

  function bindSortBar() {
    const filterSel = document.getElementById('filterBevutoSel');
    const groupSel = document.getElementById('groupBySel');
    const sel = document.getElementById('sortFieldSel');
    const btn = document.getElementById('sortDirBtn');
    const expandBtn = document.getElementById('expandAllBtn');
    const collapseBtn = document.getElementById('collapseAllBtn');
    if (filterSel) filterSel.onchange = () => { bevutoFilter = filterSel.value; refreshCurrentViewPreservingScroll(); };
    const favFilterBtn = document.getElementById('favFilterBtn');
    if (favFilterBtn) favFilterBtn.onclick = () => { onlyFavorites = !onlyFavorites; refreshCurrentViewPreservingScroll(); };
    if (groupSel) groupSel.onchange = () => { groupBy = groupSel.value; expandedGroups = new Set(); refreshCurrentViewPreservingScroll(); };
    if (sel) sel.onchange = () => { sortField = sel.value; refreshCurrentViewPreservingScroll(); };
    if (btn) btn.onclick = () => { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; refreshCurrentViewPreservingScroll(); };
    if (expandBtn) expandBtn.onclick = () => { lastGroupKeys.forEach(k => expandedGroups.add(k)); refreshCurrentViewPreservingScroll(); };
    if (collapseBtn) collapseBtn.onclick = () => { expandedGroups = new Set(); refreshCurrentViewPreservingScroll(); };
  }
  function applyBevutoFilter(list) {
    let out = list;
    if (bevutoFilter === 'si') out = out.filter(w => w.bevuto);
    else if (bevutoFilter === 'no') out = out.filter(w => w.disponibileVendita && Number(w.quantita) > 0);
    if (onlyFavorites) out = out.filter(w => w.preferito);
    return out;
  }
  function refreshCurrentView() {
    if (currentQuery) { renderSearchResults(currentQuery); } else { render(); }
  }
  function refreshCurrentViewPreservingScroll() {
    const y = window.scrollY;
    refreshCurrentView();
    window.scrollTo({ top: y });
  }
  function renderWineListHtml(list, hideKind) {
    if (groupBy === 'nessuno') {
      const sorted = sortedWines(list);
      lastGroupKeys = [];
      return `<div class="wine-list">${sorted.length ? sorted.map(w => wineRow(w, hideKind)).join('') : emptyState()}</div>`;
    }
    const groups = new Map();
    list.forEach(w => {
      const key = groupKeyFor(w, groupBy);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(w);
    });
    const groupKeys = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b, 'it'));
    lastGroupKeys = groupKeys;
    if (!groupKeys.length) return emptyState();
    return `
      <div class="group-list">
        ${groupKeys.map(key => {
          const items = groups.get(key).slice().sort((a, b) => posSortValue(a.posizione) - posSortValue(b.posizione));

          const isOpen = expandedGroups.has(key);

  function bindGroupToggles() {
    document.querySelectorAll('.group-header').forEach(btn => {

  // ---- derived indexes (rebuilt after every data change) ----
  let byType = new Map();
  let byCantina = new Map();
  let byPos = new Map();
  let byId = new Map();
  let byDate = new Map();
  let totalBottles = 0;

  function rebuildIndexes() {
    byType = new Map(); byCantina = new Map(); byPos = new Map(); byId = new Map(); byDate = new Map();
    totalBottles = 0;
    WINES.forEach(w => {
      const t = fmtType(w.tipo);
      const c = fmtCantina(w.cantina);
      if (!byType.has(t)) byType.set(t, []);
      byType.get(t).push(w);
      if (!byCantina.has(c)) byCantina.set(c, []);
      byCantina.get(c).push(w);
      const pk = posKey(w.posizione);
      if (!byPos.has(pk)) byPos.set(pk, []);
      byPos.get(pk).push(w);
      byId.set(w.id, w);
      if (w.dataApertura) {
        if (!byDate.has(w.dataApertura)) byDate.set(w.dataApertura, { opened: [], closed: [] });
        byDate.get(w.dataApertura).opened.push(w);
      }
      if (w.dataFine) {
        if (!byDate.has(w.dataFine)) byDate.set(w.dataFine, { opened: [], closed: [] });
        byDate.get(w.dataFine).closed.push(w);
      }
      totalBottles += w.quantita;
    });
  }

  function daysBetween(a, b) {
    if (!a || !b) return null;
    const d1 = new Date(a + 'T00:00:00');
    const d2 = new Date(b + 'T00:00:00');
    if (isNaN(d1) || isNaN(d2)) return null;
    return Math.round((d2 - d1) / 86400000);
  }
  function fmtDateIt(d) {
    if (!d) return '&mdash;';
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function todayStr() {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }
  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function exportExcel() {
    try {
      const rows = sortedWines(WINES).map(w => {

          'Cantina': w.cantina || '',
          'Tipologia': w.tipo || '',
          'Nome': w.nome || '',

        row['Data fine'] = w.dataFine || '';

        row['Acidità'] = (w.acidita !== null && w.acidita !== undefined) ? w.acidita : '';

      });

      showToast('Esportazione non riuscita: ' + (e.message || e));

  }

  function sortedEntries(map) {
    return Array.from(map.entries()).sort((a, b) => {
      const qa = a[1].reduce((s, w) => s + w.quantita, 0);
      const qb = b[1].reduce((s, w) => s + w.quantita, 0);
      if (qb !== qa) return qb - qa;
      return a[0].localeCompare(b[0], 'it');
    });
  }

  function sortedWines(list) {
    const cmp = compareBy(sortField);
    const sorted = [...list].sort(cmp);
    return sortDir === 'desc' ? sorted.reverse() : sorted;
  }

  // ---- remote data load ----

      quantita: w.quantita,
      posizione: normalizeBoxLabel(w.posizione) || Number(w.posizione),
      dimensione: w.dimensione,
      formato: w.formato || DEFAULT_FORMATO,

      effervescenza: w.effervescenza || null,

  // Dati riservati (prezzo di acquisto): stanno nella tabella wine_private,
  // leggibile e modificabile solo dagli amministratori. I visitatori non la ricevono mai.
  async function loadWinePrivate() {
    try {
      const { data, error } = await sb.from('wine_private').select('wine_id, prezzo_acquisto');
      if (error || !data) return;
      const m = new Map(data.map(r => [String(r.wine_id), r]));
      WINES.forEach(w => {
        const r = m.get(String(w.id));
        if (r) w.prezzoAcquisto = (r.prezzo_acquisto === null || r.prezzo_acquisto === undefined) ? null : Number(r.prezzo_acquisto);
      });
    } catch (e) { /* tabella non ancora creata: si resta sul valore in wines */ }
  }
  async function saveWinePrivate(id, fields) {
    const row = Object.assign({ wine_id: String(id), updated_at: new Date().toISOString() }, fields);
    const { data, error } = await sb.from('wine_private').upsert(row, { onConflict: 'wine_id' }).select('wine_id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('il database ha rifiutato la modifica (permessi insufficienti).');
  }

  // ---- toast ----
  let toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function setSaving(on) {
    document.body.classList.toggle('saving', on);
  }

  // ---- routing ----
  function parseHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
    if (parts.length === 0) return { route: 'home' };
    return { route: parts[0], key: parts[1] };
  }

  function go(route, key) {
    currentQuery = '';
    const sBox = document.getElementById('searchBox');
    const sClear = document.getElementById('searchClear');
    if (sBox) sBox.value = '';
    if (sClear) sClear.hidden = true;
    const newHash = '/' + route + (key ? '/' + encodeURIComponent(key) : '');
    if (location.hash.replace(/^#/, '') === newHash) {
      // l'hash non cambia: hashchange non scatterebbe da solo, quindi ri-renderizziamo a mano
      render();
    } else {
      location.hash = newHash;
    }
  }
  window.__go = go;

  let editingId = null;
  let confirmingId = null;
  let currentQuery = '';

  function searchableString(w) {
    return [w.cantina, w.tipo, w.nome, w.annata, w.quantita, posShort(w.posizione), w.prezzo]
      .filter(v => v !== null && v !== undefined && v !== '')
      .join(' ')
      .toLowerCase();
  }

  function performSearch(q) {
    currentQuery = q.trim();
    const sClear = document.getElementById('searchClear');
    if (sClear) sClear.hidden = !currentQuery;
    if (!currentQuery) { render(); return; }
    renderSearchResults(currentQuery);
  }

  function renderSearchResults(q) {
    const needle = q.toLowerCase();
    const rawMatches = WINES.filter(w => searchableString(w).includes(needle));
    const matches = applyBevutoFilter(rawMatches);
    document.querySelectorAll('#navPills button').forEach(b => b.classList.remove('active'));
    closeOverlay();
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="page-head">
        <div class="breadcrumb">Ricerca in tutti i campi</div>
        <h2>Risultati per &ldquo;${escHtml(q)}&rdquo;</h2>
        <div class="count-line">${matches.length} etichetta/e trovate (${rawMatches.length} totali)</div>
      </div>
      ${sortBarHtml()}
      ${renderWineListHtml(matches)}
    `;
    window.scrollTo({ top: 0 });
    bindPositionLinks();
    bindRowActions();
    bindSortBar();
    bindGroupToggles();
  }

  function renderPreservingScroll() {
    const y = window.scrollY;
    render();
    window.scrollTo({ top: y });
  }

  function render() {
    const { route, key } = parseHash();
    document.querySelectorAll('#navPills button').forEach(b => {
      const isActive = b.dataset.route === route;
      b.classList.toggle('active', isActive);
      if (isActive) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    const app = document.getElementById('app');
    closeOverlay();
    if (route === 'tipo' && key) {
      app.innerHTML = renderDetailPage('tipo', key);
    } else if (route === 'cantina' && key) {
      app.innerHTML = renderDetailPage('cantina', key);
    } else if (route === 'tipo') {
      app.innerHTML = renderIndexPage('tipo');
    } else if (route === 'cantina') {
      app.innerHTML = renderIndexPage('cantina');
    } else if (route === 'tutte') {
      app.innerHTML = renderAllWinesPage();
    } else if (route === 'preferiti') {
      app.innerHTML = renderFavoritesPage();
    } else if (route === 'mappa') {
      app.innerHTML = renderMapPage();
      bindMapEvents();
      if (key) openSlotPanel(key);
      bindPositionLinks();
      bindRowActions();
      return;
    } else if (route === 'calendario') {
      app.innerHTML = renderCalendarPage();
      bindCalendarEvents();
      window.scrollTo({ top: 0 });
      return;
    } else if (route === 'geo') {
      app.innerHTML = renderGeoPage();
      bindGeoEvents();
      window.scrollTo({ top: 0 });
      return;
    } else {
      app.innerHTML = renderHome();
    }
    window.scrollTo({ top: 0 });
    bindPositionLinks();
    bindRowActions();
    bindSortBar();
    bindGroupToggles();
  }

      <section class="home-section pairing-section">

        <form id="winePairingForm" class="pairing-form">
          <label for="winePairingDish">Che cosa cucini?</label>
          <div class="pairing-controls"><input id="winePairingDish" name="dish" type="text" maxlength="240" placeholder="Es. brasato al vino rosso, risotto ai funghi…" required><button class="export-btn" type="submit">Suggerisci il vino</button></div>
        </form>

  // ---- INDEX ----
  function renderIndexPage(kind) {
    const map = kind === 'tipo' ? byType : byCantina;
    const title = kind === 'tipo' ? 'Tutte le tipologie' : 'Tutte le cantine';
    const entries = sortedEntries(map);
    return `
      <div class="page-head">
        <div class="breadcrumb"><button onclick="__go('home')">Home</button> / ${title}</div>
        <h2>${title}</h2>
        <div class="count-line">${entries.length} voci &middot; ${totalBottles} bottiglie in totale</div>
      </div>
      <div class="chip-grid">
        ${entries.map(([name, list]) => {
          const q = list.reduce((s, w) => s + w.quantita, 0);
          return `<button class="chip" onclick="__go('${kind}','${escAttr(name)}')">${escHtml(name)}<span class="count">${q}</span></button>`;
        }).join('')}
      </div>
    `;
  }

  // ---- DETAIL ----
  function renderDetailPage(kind, key) {
    const map = kind === 'tipo' ? byType : byCantina;
    const rawList = map.get(key) || [];
    const list = applyBevutoFilter(rawList);
    const total = list.reduce((s, w) => s + w.quantita, 0);
    return `
      <div class="page-head">
        <div class="breadcrumb"><button onclick="__go('home')">Home</button> / <button onclick="__go('${kind}')">${kind === 'tipo' ? 'Tipologie' : 'Cantine'}</button> / ${escHtml(key)}</div>
        <h2>${escHtml(key)}</h2>
        <div class="count-line">${list.length} etichette (${rawList.length} totali) &middot; ${total} bottiglie</div>
      </div>
      ${sortBarHtml()}
      ${renderWineListHtml(list, kind)}
    `;
  }

  function renderAllWinesPage() {
    const list = applyBevutoFilter(WINES);
    const total = list.reduce((s, w) => s + w.quantita, 0);
    return `
      <div class="page-head">
        <div class="breadcrumb"><button onclick="__go('home')">Home</button> / Tutte le bottiglie</div>
        <h2>Tutte le bottiglie</h2>
        <div class="count-line">${list.length} etichette (${WINES.length} totali) &middot; ${total} bottiglie</div>
      </div>
      ${sortBarHtml()}
      ${renderWineListHtml(list)}
    `;
  }

  function renderFavoritesPage() {
    const favs = WINES.filter(w => w.preferito);
    const list = applyBevutoFilter(favs);
    const total = list.reduce((s, w) => s + w.quantita, 0);
    return `
      <div class="page-head">
        <div class="breadcrumb"><button onclick="__go('home')">Home</button> / Preferiti</div>
        <h2>&#127863; I tuoi preferiti</h2>
        <div class="count-line">${list.length} etichette (${favs.length} totali) &middot; ${total} bottiglie</div>
      </div>
      ${sortBarHtml()}
      ${renderWineListHtml(list)}
