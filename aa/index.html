  }

  function thumbHtml(w) {
    if (w.immagineUrl) {
      return `<img src="${escAttr(w.immagineUrl)}" alt="Etichetta di ${escHtml(fmtName(w))}">
        <span class="thumb-preview" aria-hidden="true"><img src="${escAttr(w.immagineUrl)}" alt=""></span>`;
    }
    return `<span class="thumb-icon" aria-hidden="true">🍾</span>`;
  }

  function wineRow(w, hideKind) {
    const isEditing = editingId === w.id;
    const isConfirming = confirmingId === w.id;
    const type = fmtType(w.tipo);
    const cantina = fmtCantina(w.cantina);
    const metaParts = [];
    if (hideKind !== 'cantina') metaParts.push(`<a href="javascript:void(0)" onclick="__go('cantina','${escAttr(cantina)}')">${escHtml(cantina)}</a>`);
    if (hideKind !== 'tipo') metaParts.push(`<a href="javascript:void(0)" onclick="__go('tipo','${escAttr(type)}')">${escHtml(type)}</a>`);
    const formatoDisp = w.formato && w.formato !== DEFAULT_FORMATO ? w.formato : null;
    const gradoDisp = fmtGrado(w.grado);
    if (formatoDisp) metaParts.push(escHtml(formatoDisp));
    if (gradoDisp) metaParts.push(gradoDisp);
    if (w.dolcezza) metaParts.push(escHtml(w.dolcezza));
    if (w.regione) metaParts.push(escHtml(w.regione));
    else if (w.paese) metaParts.push(escHtml(w.paese));
    if (w.bevuto && w.dataApertura) metaParts.push('Aperta il ' + fmtDateIt(w.dataApertura));

    const priceDisp = fmtPrice(w.prezzo);

    const rightHtml = isEditing ? `
        <div class="wine-right editing">
          <label class="f-label">Annata<input type="number" class="f-input f-annata" value="${w.annata}" inputmode="numeric"></label>
          <label class="f-label">Bott.<input type="number" class="f-input f-qty" value="${w.quantita}" min="0" inputmode="numeric"></label>
          <label class="f-label">Scaffale<input type="text" class="f-input f-pos" value="${posShort(w.posizione)}" placeholder="es. 3.4 o Box1"></label>
          <label class="f-label">Prezzo &euro;<input type="number" class="f-input f-price" value="${w.prezzo !== null && w.prezzo !== undefined ? w.prezzo : ''}" min="0" step="0.5" placeholder="&mdash;"></label>
          <label class="f-label">Formato<select class="f-input f-formato">
            ${FORMATO_OPTIONS.map(o => `<option value="${escAttr(o)}" ${o === w.formato ? 'selected' : ''}>${o}</option>`).join('')}
          </select></label>
          <label class="f-label">Grado<select class="f-input f-grado">
            <option value="">&mdash;</option>
            ${GRADO_OPTIONS.map(g => `<option value="${g}" ${w.grado !== null && w.grado !== undefined && Math.abs(w.grado - g) < 0.01 ? 'selected' : ''}>${fmtGrado(g)}</option>`).join('')}
          </select></label>
          <label class="f-label">Paese<select class="f-input f-paese">
            <option value="">&mdash;</option>
            ${PAESE_OPTIONS.map(o => `<option value="${escAttr(o)}" ${o === w.paese ? 'selected' : ''}>${o}</option>`).join('')}
          </select></label>
          <label class="f-label">Regione<select class="f-input f-regione">
            ${regioneOptionsHtml(w.paese, w.regione)}
          </select></label>
          <div class="edit-actions">
            <button class="save-btn row-save-btn" data-id="${w.id}">Salva</button>
            <button class="cancel-btn" data-id="${w.id}">Annulla</button>
          </div>
          <p class="f-error" id="err-${w.id}" hidden>Posizione non valida. Usa il formato scaffale.posto (es. 3.4) oppure Box1&ndash;Box6</p>
        </div>
      ` : isConfirming ? (w.bevuto ? `
        <div class="wine-right confirming">
          <span class="confirm-text">Ripristinare questa bottiglia come disponibile?</span>
          <p class="f-error" style="display:block; margin:4px 0;">&#9888; ${restoreWarningText(w)}</p>
          <div class="edit-actions">
            <button class="restore-yes" data-id="${w.id}">Sì, ripristina</button>
            <button class="cancel-btn" data-id="${w.id}">Annulla</button>
          </div>
        </div>
      ` : `
        <div class="wine-right confirming">
          <span class="confirm-text">Segna come bevuta &mdash; inserisci le date:</span>
          <p class="f-error" style="display:block; margin:4px 0;">&#9888; ${drinkWarningText(w)}</p>
          <label class="f-label">Apertura<input type="date" class="f-input f-data-apertura" value="${w.dataApertura || todayStr()}"></label>
          <label class="f-label">Fine<input type="date" class="f-input f-data-fine" value="${w.dataFine || todayStr()}"></label>
          <div class="edit-actions">
            <button class="confirm-yes drink-confirm-yes" data-id="${w.id}">Conferma</button>
            <button class="cancel-btn" data-id="${w.id}">Annulla</button>
          </div>
          <p class="f-error" id="drink-err-${w.id}" hidden>Inserisci entrambe le date (fine non prima di apertura).</p>
        </div>
      `) : `
        <div class="wine-right">
          <button class="icon-btn fav-btn${w.preferito ? ' is-fav' : ''}" data-id="${w.id}" title="${w.preferito ? 'Togli dai preferiti' : 'Aggiungi ai preferiti'}" aria-label="${w.preferito ? 'Togli dai preferiti' : 'Aggiungi ai preferiti'}">&#127863;</button>
          ${w.bevuto ? '<span class="bevuta-badge">Bevuta</span>' : ''}
          ${w.disponibileVendita ? '<span class="sale-badge">In vendita</span>' : ''}
          ${w.disponibileVendita ? `<button class="cart-add-btn${(cart[w.id] || 0) > 0 ? ' in-cart' : ''}" data-id="${w.id}" title="${(cart[w.id] || 0) > 0 ? (cart[w.id] + ' nel carrello — aggiungi ancora') : 'Aggiungi al carrello'}" aria-label="Aggiungi al carrello">&#128722;${(cart[w.id] || 0) > 0 ? `<span style="margin-left:3px;font-size:0.72rem;">${cart[w.id]}</span>` : ''}</button>` : `<button class="request-avail-btn" data-id="${w.id}" title="Richiedi disponibilità" aria-label="Richiedi disponibilità">&#9993;</button>`}
          ${w.giudizioComplessivo !== null && w.giudizioComplessivo !== undefined ? `<span class="score-badge" title="Giudizio complessivo">${w.giudizioComplessivo}/100</span>` : ''}
          <span class="vintage">${w.annata}</span>
          <span class="qty">${w.quantita} bott.</span>
          <span class="price ${priceDisp ? '' : 'price-empty'}">${priceDisp || '&ndash;'}</span>
          <button class="pos-badge" data-pos="${posKey(w.posizione)}">${posShort(w.posizione)}</button>
          <button class="icon-btn edit-btn" data-id="${w.id}" title="Modifica quantità, annata, posizione e prezzo" aria-label="Modifica">&#9998;</button>
          <button class="icon-btn del-btn" data-id="${w.id}" title="${w.bevuto ? 'Ripristina come disponibile' : 'Segna come bevuta'}" aria-label="${w.bevuto ? 'Ripristina come disponibile' : 'Segna come bevuta'}">${w.bevuto ? '&#8635;' : '&#128465;'}</button>
        </div>
      `;

    return `
      <div class="wine-row${w.bevuto ? ' is-bevuto' : ''}" data-id="${w.id}">
        <button class="thumb" data-id="${w.id}" title="Aggiungi o cambia foto della bottiglia" aria-label="Foto bottiglia">
          ${thumbHtml(w)}
        </button>
        <div class="wine-main">
          <div class="wine-name-row">
            <button class="wine-name" data-id="${w.id}" title="Apri la scheda del vino">${escHtml(fmtName(w))}</button>
            ${w.sitoProduttore ? `<a class="producer-link" href="${escAttr(w.sitoProduttore)}" target="_blank" rel="noopener" title="Sito del produttore" aria-label="Sito del produttore">&#128279;</a>` : ''}
          </div>
          <p class="wine-meta">${metaParts.join(' &middot; ')}</p>
        </div>
        ${rightHtml}
        <input type="file" accept="image/*" class="file-input" data-id="${w.id}" hidden>
      </div>
    `;
  }

  function emptyState() {
    return `<div class="empty-state"><span class="serif">Nessuna bottiglia trovata</span>Prova a tornare alla home.</div>`;
  }

  function bindPositionLinks() {
    document.querySelectorAll('.pos-badge').forEach(btn => {
      btn.addEventListener('click', () => go('mappa', btn.dataset.pos));
    });
  }

  function refreshRowFromEl(rowEl, id) {
    const w = byId.get(id);
    if (!rowEl || !w) { render(); return; }
    const insideOverlay = !!rowEl.closest('#overlayRoot');
    let hideKind = null;
    if (!insideOverlay) {
      const { route } = parseHash();
      hideKind = (route === 'tipo' || route === 'cantina') ? route : null;
    }
    rowEl.outerHTML = wineRow(w, hideKind);
    bindRowActions();
    bindPositionLinks();
  }

  function bindRowActions() {
    const exportBtn = document.getElementById('exportExcelBtn');
    if (exportBtn) exportBtn.onclick = exportExcel;
    document.querySelectorAll('.f-paese').forEach(sel => {
      sel.onchange = () => {
        const regioneSel = sel.closest('.wine-right').querySelector('.f-regione');
        if (regioneSel) regioneSel.innerHTML = regioneOptionsHtml(sel.value, null);
      };
    });
    const heroPhotoBtn = document.getElementById('heroPhotoBtn');
    const heroPhotoInput = document.getElementById('heroPhotoInput');
    if (heroPhotoBtn && heroPhotoInput) {
      heroPhotoBtn.onclick = () => heroPhotoInput.click();
      heroPhotoInput.onchange = async () => {
        const file = heroPhotoInput.files && heroPhotoInput.files[0];
        if (!file) return;
        setSaving(true);
        try {
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const path = 'home/hero-' + Date.now() + '.' + ext;
          const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(path, file, { upsert: true });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
          const url = pub.publicUrl;
          const { error: setErr } = await sb.from('site_settings').upsert({ key: 'foto_home', value: url });
          if (setErr) throw setErr;
          heroPhotoUrl = url;
          const img = heroPhotoBtn.querySelector('img');
          if (img) img.src = url;
          showToast('Foto della home aggiornata.');
        } catch (e) {
          showToast('Caricamento foto non riuscito: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    }
    document.querySelectorAll('.wine-name').forEach(btn => {
      btn.onclick = () => openWineDetail(btn.dataset.id);
    });
    document.querySelectorAll('.thumb').forEach(btn => {
      btn.onclick = () => {
        const scope = btn.closest('.wine-row') || btn.closest('.panel');
        const inp = scope && scope.querySelector(`.file-input[data-id="${btn.dataset.id}"]`);
        if (inp) inp.click();
      };
    });
    document.querySelectorAll('.file-input').forEach(inp => {
      inp.onchange = async () => {
        const file = inp.files && inp.files[0];
        if (!file) return;
        const id = inp.dataset.id;
        const rowEl = inp.closest('.wine-row');
        setSaving(true);
        try {
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const path = id + '-' + Date.now() + '.' + ext;
          const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(path, file, { upsert: true });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
          const url = pub.publicUrl;
          await saveWineFields(id, { immagine_url: url });
          const w = byId.get(id);
          w.immagineUrl = url;
          if (rowEl) refreshRowFromEl(rowEl, id);
          const panelThumb = document.querySelector(`.panel.detail .thumb[data-id="${id}"]`);
          if (panelThumb) panelThumb.innerHTML = thumbHtml(w);
        } catch (e) {
          showToast('Caricamento immagine non riuscito: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
    document.querySelectorAll('.cart-add-btn').forEach(btn => {
      btn.onclick = () => addToCart(btn.dataset.id);
    });
    document.querySelectorAll('.request-avail-btn').forEach(btn => {
      btn.onclick = () => openAvailabilityRequestModal(btn.dataset.id);
    });
    document.querySelectorAll('.fav-btn').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const w = byId.get(id);
        if (!w) return;
        const newVal = !w.preferito;
        const rowEl = btn.closest('.wine-row');
        btn.classList.add('drinking');
        setSaving(true);
        try {
          const [result] = await Promise.all([
            saveUserWineState(id, { preferito: newVal }),
            new Promise(resolve => setTimeout(resolve, 700)),
          ]);
          if (result.error) throw result.error;
          w.preferito = newVal;
          if (rowEl) {
            refreshRowFromEl(rowEl, id);
          } else {
            btn.classList.remove('drinking');
            btn.classList.toggle('is-fav', newVal);
            btn.title = newVal ? 'Togli dai preferiti' : 'Aggiungi ai preferiti';
            btn.setAttribute('aria-label', btn.title);
          }
        } catch (e) {
          btn.classList.remove('drinking');
          showToast('Impossibile aggiornare i preferiti: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.onclick = () => {
        editingId = btn.dataset.id;
        confirmingId = null;
        const rowEl = btn.closest('.wine-row');
        refreshRowFromEl(rowEl, editingId);
        const first = rowEl && rowEl.querySelector('.f-annata');
        if (first) first.focus();
      };
    });
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = () => {
        confirmingId = btn.dataset.id;
        editingId = null;
        refreshRowFromEl(btn.closest('.wine-row'), confirmingId);
      };
    });
    document.querySelectorAll('.cancel-btn').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        editingId = null;
        confirmingId = null;
        const rowEl = btn.closest('.wine-row');
        if (rowEl) { refreshRowFromEl(rowEl, id); } else { render(); }
      };
    });
    document.querySelectorAll('.drink-confirm-yes').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const rowEl = btn.closest('.wine-row');
        const scope = rowEl || document;
        const aperturaInput = scope.querySelector('.f-data-apertura');
        const fineInput = scope.querySelector('.f-data-fine');
        const apertura = aperturaInput ? aperturaInput.value : '';
        const fine = fineInput ? fineInput.value : '';
        const errEl = document.getElementById('drink-err-' + id);
        if (!apertura || !fine || fine < apertura) {
          if (errEl) errEl.hidden = false;
          return;
        }
        const w = byId.get(id);
        const payload = { bevuto: true, data_apertura: apertura, data_fine: fine };
        const oldQty = Number(w.quantita) || 0;
        const newQty = Math.max(0, oldQty - 1);
        setSaving(true);
        try {
          if (newQty !== oldQty) await persistWineQuantity(id, newQty);
          try {
            await saveUserWineState(id, payload);
          } catch (stErr) {
            if (newQty !== oldQty) { try { await persistWineQuantity(id, oldQty); } catch (_) {} }
            throw stErr;
          }
          w.quantita = newQty;
          w.bevuto = true;
          w.dataApertura = apertura;
          w.dataFine = fine;
          rebuildIndexes();
          confirmingId = null;
          const insideOverlay = rowEl && !!rowEl.closest('#overlayRoot');
          if (!insideOverlay && bevutoFilter !== 'tutte') {
            refreshCurrentViewPreservingScroll();
          } else if (rowEl) {
            refreshRowFromEl(rowEl, id);
          } else {
            render();
          }
        } catch (e) {
          showToast('Impossibile salvare: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
    document.querySelectorAll('.restore-yes').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const rowEl = btn.closest('.wine-row');
        const w = byId.get(id);
        const payload = { bevuto: false, data_apertura: null, data_fine: null };
        const oldQty = Number(w.quantita) || 0;
        const newQty = oldQty + 1;
        setSaving(true);
        try {
          await persistWineQuantity(id, newQty);
          try {
            await saveUserWineState(id, payload);
          } catch (stErr) {
            try { await persistWineQuantity(id, oldQty); } catch (_) {}
            throw stErr;
          }
          w.quantita = newQty;
          w.bevuto = false;
          w.dataApertura = null;
          w.dataFine = null;
          rebuildIndexes();
          confirmingId = null;
          const insideOverlay = rowEl && !!rowEl.closest('#overlayRoot');
          if (!insideOverlay && bevutoFilter !== 'tutte') {
            refreshCurrentViewPreservingScroll();
          } else if (rowEl) {
            refreshRowFromEl(rowEl, id);
          } else {
            render();
          }
        } catch (e) {
          showToast('Impossibile ripristinare: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
    document.querySelectorAll('.row-save-btn').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const row = document.querySelector(`.wine-row[data-id="${id}"]`);
        const w = byId.get(id);
        const errEl = document.getElementById('err-' + id);
        const annataVal = parseInt(row.querySelector('.f-annata').value, 10);
        const qtyVal = parseInt(row.querySelector('.f-qty').value, 10);
        const posVal = parsePos(row.querySelector('.f-pos').value);
        const priceRaw = row.querySelector('.f-price').value;
        const priceVal = priceRaw === '' ? null : parseFloat(priceRaw);
        const formatoVal = row.querySelector('.f-formato').value || DEFAULT_FORMATO;
        const gradoRaw = row.querySelector('.f-grado').value;
        const gradoVal = gradoRaw === '' ? null : parseFloat(gradoRaw);
        const paeseVal = row.querySelector('.f-paese').value || null;
        const regioneVal = row.querySelector('.f-regione').value || null;

        if (posVal === null) {
          if (errEl) errEl.hidden = false;
          return;
        }
        const payload = {
          annata: !isNaN(annataVal) ? annataVal : w.annata,
          quantita: (!isNaN(qtyVal) && qtyVal >= 0) ? qtyVal : w.quantita,
          posizione: posVal,
          prezzo: (priceVal !== null && !isNaN(priceVal)) ? priceVal : null,
          formato: formatoVal,
          grado: (gradoVal !== null && !isNaN(gradoVal)) ? gradoVal : null,
          paese: paeseVal,
          regione: regioneVal,
        };
        setSaving(true);
        try {
          await saveWineFields(id, payload);
          Object.assign(w, payload);
          rebuildIndexes();
          editingId = null;
          renderPreservingScroll();
        } catch (e) {
          showToast('Salvataggio non riuscito: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
  }

  const IT_REGIONE_SET = new Set(REGIONI_BY_PAESE["Italia"]);

  function colorForCount(count, maxCount) {
    if (!count) return 'var(--parchment-deep)';
    const t = maxCount > 0 ? Math.min(count / maxCount, 1) : 0;
    const c1 = [224, 224, 200], c2 = [42, 58, 28];
    const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    return `rgb(${r},${g},${b})`;
  }

  function applyGeoFilters(list) {
    let out = applyBevutoFilter(list);
    if (geoColoreFilter !== 'tutte') out = out.filter(w => w.coloreVino === geoColoreFilter);
    if (geoEffervescenzaFilter !== 'tutte') out = out.filter(w => w.effervescenza === geoEffervescenzaFilter);
    return out;
  }

  function buildGeoCounts() {
    const it = new Map();
    const fr = new Map();
    applyGeoFilters(WINES).forEach(w => {
      const regione = w.regione ? String(w.regione).trim() : '';
      if (!regione) return;
      if (IT_REGIONE_SET.has(regione)) {
        const itId = IT_REGIONE_TO_ID[regione];
        it.set(itId, (it.get(itId) || 0) + w.quantita);
      } else if (FR_REGIONE_TO_ADMIN[regione]) {
        const adminId = FR_REGIONE_TO_ADMIN[regione];
        fr.set(adminId, (fr.get(adminId) || 0) + w.quantita);
      }
    });
    return { it, fr };
  }

  function geoMapSvg(paths, viewBox, counts, maxCount, prefix, labelFor) {
    const regions = paths.map(p => {
      const count = counts.get(p.id) || 0;
      const fill = colorForCount(count, maxCount);
      const label = labelFor(p.id);
      return `<path data-region-id="${p.id}" data-count="${count}" d="${p.d}" style="fill:${fill}" class="geo-region${count ? ' has-wines' : ''}"><title>${escHtml(label)}${count ? ' — ' + count + ' bottiglia/e' : ''}</title></path>`;
    }).join('');
    return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" aria-label="Mappa" class="geo-svg" data-prefix="${prefix}">${regions}</svg>`;
  }

  function geoFilterBarHtml() {
    const filterOpts = [['tutte', 'Tutte'], ['no', 'Solo disponibili'], ['si', 'Solo bevute']];
    return `
      <div class="sort-bar">

          <div class="geo-svg-wrap" id="geoItWrap">${geoMapSvg(GEO_IT_PATHS, GEO_IT_VIEWBOX, itCounts, itMax, 'it', id => IT_ID_TO_REGIONE[id] || id)}</div>

          <div class="geo-svg-wrap" id="geoFrWrap">${geoMapSvg(GEO_FR_PATHS, GEO_FR_VIEWBOX, frCounts, frMax, 'fr', id => FR_ADMIN_NAMES[id] || id)}</div>

  function annotateGeoBadges(svgEl, prefix) {
    if (!svgEl) return;
    const SVGNS = 'http://www.w3.org/2000/svg';
    svgEl.querySelectorAll('path.has-wines').forEach(path => {
      path.addEventListener('click', () => openGeoRegion(prefix, path.dataset.regionId));
      let bbox;
      try { bbox = path.getBBox(); } catch (e) { return; }
      const cx = bbox.x + bbox.width / 2;
      const cy = bbox.y + bbox.height / 2;
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'geo-badge');
      g.setAttribute('transform', `translate(${cx},${cy})`);
      const circle = document.createElementNS(SVGNS, 'circle');
      circle.setAttribute('r', '13');
      const text = document.createElementNS(SVGNS, 'text');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'central');
      text.textContent = path.dataset.count;
      g.appendChild(circle);
      g.appendChild(text);
      g.addEventListener('click', () => openGeoRegion(prefix, path.dataset.regionId));
      svgEl.appendChild(g);
    });
  }

  function openGeoRegion(prefix, regionId) {
    let title, list;

      title = name + ' (Italia)';
      list = filtered.filter(w => w.regione === name);

  function drunkInMonth(year, month) {
    return WINES.filter(w => {
      if (!w.bevuto || !w.dataFine) return false;
      const d = new Date(w.dataFine + 'T00:00:00');
      return d.getFullYear() === year && d.getMonth() === month;
    });

  // ---- richieste di disponibilità (vini non in vendita) ----
  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }
  function isValidPhone(v) {
    const s = v.trim();
    const digits = s.replace(/\D/g, '');
    return /^[0-9+\-\s()]{6,20}$/.test(s) && digits.length >= 6;
  }

  // ---- Impostazioni generali del sito (icona ingranaggio, solo Admin) ----
  async function callAdminManage(body) {
    const { data, error } = await sb.functions.invoke('admin-manage', { body });
    if (error) {
      let msg = error.message || 'Operazione non riuscita.';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e2) { /* ignora */ }
      throw new Error(msg);
    }
    if (!data || !data.ok) throw new Error((data && data.error) || 'Operazione non riuscita.');

  function bindAdminManagement() {
    const listEl = document.getElementById('adminsList');
    const errEl = document.getElementById('adminsError');
    const showErr = (m) => { errEl.textContent = m; errEl.hidden = !m; };

    const loadList = async () => {
      try {
        const data = await callAdminManage({ action: 'list' });
        const me = (currentUser && currentUser.email || '').toLowerCase();
        listEl.innerHTML = (data.admins || []).map(a => `
          <div class="admin-item">
            <span class="admin-mail">${escHtml(a.email)}</span>
            <span class="admin-role">${a.role === 'super_admin' ? 'Super Admin' : 'Admin'}</span>
            ${a.role === 'admin' && a.email.toLowerCase() !== me ? `<button class="admin-del" data-email="${escAttr(a.email)}" title="Rimuovi amministratore" aria-label="Rimuovi amministratore">&times;</button>` : ''}
          </div>`).join('') || '<p class="empty-hint">Nessun amministratore.</p>';
        listEl.querySelectorAll('.admin-del').forEach(btn => {
          btn.onclick = async () => {
            const email = btn.dataset.email;
            if (!window.confirm('Rimuovere i poteri di amministratore a ' + email + '?')) return;
            showErr('');
            setSaving(true);
            try {
              await callAdminManage({ action: 'remove', email });
              showToast('Amministratore rimosso.');
              await loadList();
            } catch (e) { showErr(e.message || 'Rimozione non riuscita.'); }
            finally { setSaving(false); }
          };
        });
      } catch (e) {
        listEl.innerHTML = '';
        showErr(e.message || 'Impossibile caricare gli amministratori. Verifica che la funzione admin-manage sia stata pubblicata.');
      }
    };
    loadList();

    document.getElementById('addAdminBtn').onclick = async () => {
      showErr('');
      const email = document.getElementById('newAdminEmail').value.trim().toLowerCase();
      const password = document.getElementById('newAdminPassword').value;
      if (!isValidEmail(email)) { showErr('Inserisci un indirizzo email valido.'); return; }
      if (password.length < 12) { showErr('La password deve avere almeno 12 caratteri.'); return; }
      setSaving(true);
      try {
        await callAdminManage({ action: 'add', email, password });
        document.getElementById('newAdminEmail').value = '';
        document.getElementById('newAdminPassword').value = '';
        showToast('Amministratore aggiunto.');
        await loadList();
      } catch (e) {
        showErr(e.message || 'Aggiunta non riuscita.');
      } finally {
        setSaving(false);
      }
    };
  }

  function bindMsgDeleteButtons(container, tableName) {
    container.querySelectorAll('.msg-del-btn').forEach(btn => {
      btn.onclick = async () => {
        if (!window.confirm('Eliminare questo messaggio?')) return;
        try {
          const { error } = await sb.from(tableName).delete().eq('id', btn.dataset.id);
          if (error) throw error;
          const item = btn.closest('.msg-item');
          if (item) item.remove();
        } catch (e) {
          showToast('Impossibile eliminare: ' + (e.message || e));
        }
      };
    });
  }

    };
  }

  // ---- wine detail card (info, nota, allegati) ----
  let detailWineId = null;
  const ATTACH_CATEGORIES = ["Scheda Tecnica", "Valutazione Assaggio", "Altro"];

  function detailStatoHtml(w) {
    if (w.bevuto) {
      const days = daysBetween(w.dataApertura, w.dataFine);
      return `
        <h4>Stato</h4>
        <p class="bevuta-info">Aperta il ${fmtDateIt(w.dataApertura)}, finita il ${fmtDateIt(w.dataFine)}${days !== null ? ` &mdash; ${days} giorno${days === 1 ? '' : 'i'}` : ''}.</p>
        <button id="detailRestoreBtn" class="cancel-btn">Ripristina come disponibile</button>
        <div class="giudizio-bevitore-field">
          <p class="hint" style="margin-bottom:6px;">Giudizio bevitore</p>
          <textarea id="detailGiudizioBevitore" rows="2" placeholder="Cosa ne pensi di questa bottiglia?">${escHtml(w.giudizioBevitore || '')}</textarea>
        </div>
      `;
    }
    return `
      <h4>Stato</h4>
      <div id="detailDrinkArea">
        <button id="detailMarkDrinkBtn" class="save-btn">Segna come bevuta</button>
      </div>
      <p class="giudizio-bevitore-field hint">Il giudizio del bevitore sarà visibile solo dopo aver segnato la bottiglia come bevuta.</p>
    `;
  }

  function detailDrinkFormHtml(w) {
    return `
      <p class="f-error" style="display:block; margin:0 0 8px;">&#9888; ${drinkWarningText(w)}</p>
      <label class="f-label">Apertura<input type="date" id="detailDataApertura" class="f-input" value="${w.dataApertura || todayStr()}"></label>
      <label class="f-label">Fine<input type="date" id="detailDataFine" class="f-input" value="${w.dataFine || todayStr()}"></label>
      <div class="edit-actions" style="margin-left:0;">
        <button id="detailDrinkConfirmBtn" class="confirm-yes">Conferma</button>
        <button id="detailDrinkCancelBtn" class="cancel-btn">Annulla</button>
      </div>
      <p class="f-error" id="detail-drink-err" hidden>Inserisci entrambe le date (fine non prima di apertura).</p>
    `;
  }

  function bindDetailStato(id) {
    const w = byId.get(id);
    if (!w) return;
    const markBtn = document.getElementById('detailMarkDrinkBtn');
    if (markBtn) {
      markBtn.onclick = () => {
        document.getElementById('detailDrinkArea').innerHTML = detailDrinkFormHtml(w);
        document.getElementById('detailDrinkConfirmBtn').onclick = async () => {
          const apertura = document.getElementById('detailDataApertura').value;
          const fine = document.getElementById('detailDataFine').value;
          const errEl = document.getElementById('detail-drink-err');
          if (!apertura || !fine || fine < apertura) {
            if (errEl) errEl.hidden = false;
            return;
          }
          setSaving(true);
          try {
            const payload = { bevuto: true, data_apertura: apertura, data_fine: fine };
            const oldQty = Number(w.quantita) || 0;
            const newQty = Math.max(0, oldQty - 1);
            if (newQty !== oldQty) await persistWineQuantity(id, newQty);
            try {
              await saveUserWineState(id, payload);
            } catch (stErr) {
              if (newQty !== oldQty) { try { await persistWineQuantity(id, oldQty); } catch (_) {} }
              throw stErr;
            }
            w.quantita = newQty;
            w.bevuto = true; w.dataApertura = apertura; w.dataFine = fine;
            rebuildIndexes();
            openWineDetail(id);
          } catch (e) {
            showToast('Impossibile salvare: ' + (e.message || e));
          } finally {
            setSaving(false);
          }
        };
        document.getElementById('detailDrinkCancelBtn').onclick = () => {
          document.getElementById('detailStatoSection').innerHTML = detailStatoHtml(w);
          bindDetailStato(id);
        };
      };
    }
    const restoreBtn = document.getElementById('detailRestoreBtn');
    if (restoreBtn) {
      restoreBtn.onclick = async () => {
        if (!window.confirm('Ripristinare questa bottiglia come disponibile?\n\n' + restoreWarningText(w))) return;
        setSaving(true);
        try {
          const payload = { bevuto: false, data_apertura: null, data_fine: null };
          const oldQty = Number(w.quantita) || 0;
          const newQty = oldQty + 1;
          await persistWineQuantity(id, newQty);
          try {
            await saveUserWineState(id, payload);
          } catch (stErr) {
            try { await persistWineQuantity(id, oldQty); } catch (_) {}
            throw stErr;
          }
          w.quantita = newQty;
          w.bevuto = false; w.dataApertura = null; w.dataFine = null;
          rebuildIndexes();
          openWineDetail(id);
        } catch (e) {
          showToast('Impossibile ripristinare: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    }
  }

  function openWineDetail(id) {
    const w = byId.get(id);
    if (!w) return;
    detailWineId = id;
    const priceDisp = fmtPrice(w.prezzo);
    const gradoDisp = fmtGrado(w.grado);
    const root = document.getElementById('overlayRoot');
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel detail${w.bevuto ? ' is-bevuto' : ''}">
          <div class="panel-head">
            <h3>${escHtml(fmtName(w))}${w.bevuto ? ' <span class="bevuta-badge">Bevuta</span>' : ''}</h3>
            <div class="panel-head-actions">
              <button id="detailFavBtn" class="icon-btn fav-btn${w.preferito ? ' is-fav' : ''}" data-id="${w.id}" title="${w.preferito ? 'Togli dai preferiti' : 'Aggiungi ai preferiti'}" aria-label="${w.preferito ? 'Togli dai preferiti' : 'Aggiungi ai preferiti'}">&#127863;</button>
              <button id="saveAllBtn" class="save-all-btn" title="Salva tutte le modifiche" aria-label="Salva tutte le modifiche">&#128190;</button>
              <button class="close-btn" id="closeDetailBtn" aria-label="Chiudi">&times;</button>
            </div>
          </div>
          <div class="panel-body">
          <div class="detail-thumb-row">
            <button class="thumb" data-id="${w.id}" title="Aggiungi o cambia foto della bottiglia" aria-label="Foto bottiglia">
              ${thumbHtml(w)}
            </button>
            <div class="detail-facts">
              <p><a href="javascript:void(0)" onclick="__go('cantina','${escAttr(fmtCantina(w.cantina))}')">${escHtml(fmtCantina(w.cantina))}</a> &middot; <a href="javascript:void(0)" onclick="__go('tipo','${escAttr(fmtType(w.tipo))}')">${escHtml(fmtType(w.tipo))}</a></p>
              <p>Annata ${w.annata} &middot; ${w.quantita} bott. &middot; ${escHtml(w.formato || DEFAULT_FORMATO)}${gradoDisp ? ' &middot; ' + gradoDisp : ''}</p>
              <p>${priceDisp || 'Prezzo non impostato'} &middot; Scaffale ${posShort(w.posizione)}</p>
            </div>
          </div>
          <label class="f-label" style="display:block; margin: 4px 0 18px;">Sito del produttore${w.sitoProduttore ? ` &middot; <a href="${escAttr(w.sitoProduttore)}" target="_blank" rel="noopener" style="font-weight:600;">Apri &#8599;</a>` : ''}
            <input type="url" id="detailSitoProduttore" class="f-input" style="width:100%;" placeholder="https://..." value="${escAttr(w.sitoProduttore || '')}">
          </label>
          <input type="file" accept="image/*" class="file-input" data-id="${w.id}" hidden>

          <div class="detail-section" id="detailStatoSection">
            ${detailStatoHtml(w)}
          </div>

          <div class="detail-section">
            <h4>Vino</h4>
            <div class="vino-fields">
              <label class="f-label">Colore vino<select id="detailColoreVino" class="f-input">
                <option value="">&mdash;</option>
                ${COLORE_OPTIONS.map(o => `<option value="${escAttr(o)}" ${o === w.coloreVino ? 'selected' : ''}>${o}</option>`).join('')}
              </select></label>
              <label class="f-label">Caratteristica vino<select id="detailEffervescenza" class="f-input">
                <option value="">&mdash;</option>
                ${EFFERVESCENZA_OPTIONS.map(o => `<option value="${escAttr(o)}" ${o === w.effervescenza ? 'selected' : ''}>${o}</option>`).join('')}
              </select></label>
              <label class="f-label">Tipo vino<select id="detailDolcezza" class="f-input">
                <option value="">&mdash;</option>
                ${dolcezzaOptionsFor(w.effervescenza).map(o => `<option value="${escAttr(o)}" ${o === w.dolcezza ? 'selected' : ''}>${o}</option>`).join('')}
              </select></label>
            </div>
            <div class="slider-field">
              <label for="detailGradoVino">Grado</label>
              <div class="slider-row">
                <input type="range" id="detailGradoVino" min="10" max="20" step="0.5" value="${w.grado !== null && w.grado !== undefined ? w.grado : 12}">
                <span class="slider-val" id="detailGradoVino-val">${fmtGrado(w.grado !== null && w.grado !== undefined ? w.grado : 12)}</span>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h4>Origine</h4>
            <div class="vino-fields">
              <label class="f-label">Paese<select id="detailPaese" class="f-input">
                <option value="">&mdash;</option>
                ${PAESE_OPTIONS.map(o => `<option value="${escAttr(o)}" ${o === w.paese ? 'selected' : ''}>${o}</option>`).join('')}
              </select></label>
              <label class="f-label">Regione<select id="detailRegione" class="f-input">
                ${regioneOptionsHtml(w.paese, w.regione)}
              </select></label>
            </div>
          </div>

          <div class="detail-section">
            <h4>Giudizio</h4>
            <div class="slider-field">
              <label for="detailGiudizioComplessivo">Giudizio complessivo</label>
              <div class="slider-row">
                <input type="range" id="detailGiudizioComplessivo" min="0" max="100" step="1" value="${w.giudizioComplessivo !== null && w.giudizioComplessivo !== undefined ? w.giudizioComplessivo : 50}">
                <span class="slider-val" id="detailGiudizioComplessivo-val">${w.giudizioComplessivo !== null && w.giudizioComplessivo !== undefined ? w.giudizioComplessivo : 50}</span>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h4>Caratteristiche vino</h4>
            ${CHARACTERISTIC_FIELDS.map(([field, label]) => `
              <div class="slider-field">
                <label for="detail-${field}">${label}</label>
                <div class="slider-row">
                  <input type="range" id="detail-${field}" min="0" max="100" step="1" value="${w[field] !== null && w[field] !== undefined ? w[field] : 50}">
                  <span class="slider-val" id="detail-${field}-val">${w[field] !== null && w[field] !== undefined ? w[field] : 50}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="detail-section">
            <h4>Prezzi</h4>
            <div class="price-fields">
              ${isAdmin ? `<label class="f-label">Prezzo acquisto &euro;<input type="number" id="detailPrezzoAcquisto" class="f-input" min="0" step="0.5" value="${w.prezzoAcquisto !== null && w.prezzoAcquisto !== undefined ? w.prezzoAcquisto : ''}" placeholder="&mdash;"></label>` : ''}
              <label class="f-label">Valore mercato &euro;<input type="number" id="detailValoreMercato" class="f-input" min="0" step="0.5" value="${w.valoreMercato !== null && w.valoreMercato !== undefined ? w.valoreMercato : ''}" placeholder="&mdash;"></label>
            </div>
            <label class="checkbox-label"${isAdmin ? '' : ' style="cursor:default; opacity:0.85;"'}>
              <input type="checkbox" id="detailDisponibileVendita" ${w.disponibileVendita ? 'checked' : ''} ${isAdmin ? '' : 'disabled aria-readonly="true"'}>
              Disponibile alla vendita
            </label>
          </div>

          <div class="detail-section">
            <h4>Note</h4>
            <textarea id="detailNota" rows="3" placeholder="Aggiungi una nota su questo vino&hellip;">${escHtml(w.nota || '')}</textarea>
          </div>

          <div class="detail-section">
            <h4>Allegati</h4>
            <div id="attachList"><p class="empty-hint">Caricamento&hellip;</p></div>
            <div class="attach-upload">
              <select id="attachCategoria">
                ${ATTACH_CATEGORIES.map(c => `<option value="${escAttr(c)}">${escHtml(c)}</option>`).join('')}
              </select>
              <input type="file" id="attachFile" accept="application/pdf,.pdf" multiple>
              <button id="attachUploadBtn" class="save-btn">Carica PDF</button>
            </div>
            <p class="f-error" id="attachUploadStatus" hidden></p>
          </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('closeDetailBtn').onclick = closeOverlay;
    document.getElementById('overlayBg').addEventListener('click', (e) => {
      if (e.target.id === 'overlayBg') closeOverlay();
    });
    root.querySelectorAll('.slider-row input[type="range"]').forEach(inp => {
      const out = document.getElementById(inp.id + '-val');
      if (!out) return;
      if (inp.id === 'detailGradoVino') {
        inp.oninput = () => { out.innerHTML = fmtGrado(parseFloat(inp.value)); };
      } else {
        inp.oninput = () => { out.textContent = inp.value; };
      }
    });
    const paeseSel = document.getElementById('detailPaese');
    if (paeseSel) {
      paeseSel.onchange = () => {
        const regioneSel = document.getElementById('detailRegione');
        if (regioneSel) regioneSel.innerHTML = regioneOptionsHtml(paeseSel.value, null);
      };
    }
    document.getElementById('saveAllBtn').onclick = async () => {
      if (!isAdmin) return; // solo l'Admin può modificare la scheda
      const payload = {};
      const coloreEl = document.getElementById('detailColoreVino');
      const effEl = document.getElementById('detailEffervescenza');
      if (coloreEl) payload.colore_vino = coloreEl.value || null;
      if (effEl) payload.effervescenza = effEl.value || null;
      const dolEl = document.getElementById('detailDolcezza');
      if (dolEl) {
        payload.dolcezza = dolEl.value || null;
        const effNow = effEl ? effEl.value : null;
        if (payload.dolcezza && !dolcezzaOptionsFor(effNow).includes(payload.dolcezza)) payload.dolcezza = null;
      }

      const gradoVinoEl = document.getElementById('detailGradoVino');
      if (gradoVinoEl) payload.grado = parseFloat(gradoVinoEl.value);

      const sitoEl = document.getElementById('detailSitoProduttore');
      if (sitoEl) payload.sito_produttore = sitoEl.value.trim() || null;

      const dispVenditaEl = document.getElementById('detailDisponibileVendita');
      if (dispVenditaEl && isAdmin) payload.disponibile_vendita = !!dispVenditaEl.checked;

      const paeseEl = document.getElementById('detailPaese');
      const regioneEl = document.getElementById('detailRegione');
      if (paeseEl) payload.paese = paeseEl.value || null;
      if (regioneEl) payload.regione = regioneEl.value || null;

      const giudEl = document.getElementById('detailGiudizioComplessivo');
      if (giudEl) payload.giudizio_complessivo = parseInt(giudEl.value, 10);

      CHARACTERISTIC_FIELDS.forEach(([field]) => {
        const el = document.getElementById('detail-' + field);
        if (el) payload[field] = parseInt(el.value, 10);
      });

      const paEl = document.getElementById('detailPrezzoAcquisto');
      const vmEl = document.getElementById('detailValoreMercato');
      if (paEl) { const v = paEl.value; payload['prezzo acquisto'] = v === '' ? null : parseFloat(v); }
      if (vmEl) { const v = vmEl.value; payload['valore mercato'] = v === '' ? null : parseFloat(v); }

      const notaEl = document.getElementById('detailNota');
      if (notaEl) payload.nota = notaEl.value;

      const gbEl = document.getElementById('detailGiudizioBevitore');
      if (gbEl) payload.giudizio_bevitore = gbEl.value;

      // pulizia valori numerici non validi (campo vuoto => null)
      Object.keys(payload).forEach(k => {
        if (typeof payload[k] === 'number' && isNaN(payload[k])) payload[k] = null;
      });
      const wineFields = Object.assign({}, payload);
      delete wineFields.giudizio_bevitore;
      const privateFields = {};
      if ('prezzo acquisto' in wineFields) {
        privateFields.prezzo_acquisto = wineFields['prezzo acquisto'];
        delete wineFields['prezzo acquisto'];
      }
      setSaving(true);
      try {
        await saveWineFields(id, wineFields);
        if (Object.keys(privateFields).length) await saveWinePrivate(id, privateFields);
        if ('giudizio_bevitore' in payload) {
          await saveUserWineState(id, { giudizio_bevitore: payload.giudizio_bevitore });
        }
        if ('colore_vino' in payload) w.coloreVino = payload.colore_vino;
        if ('effervescenza' in payload) w.effervescenza = payload.effervescenza;
        if ('dolcezza' in payload) w.dolcezza = payload.dolcezza;
        if ('grado' in payload) w.grado = payload.grado;
        if ('sito_produttore' in payload) w.sitoProduttore = payload.sito_produttore;
        if ('disponibile_vendita' in payload) w.disponibileVendita = payload.disponibile_vendita;
        if ('paese' in payload) w.paese = payload.paese;
        if ('regione' in payload) w.regione = payload.regione;
        if ('giudizio_complessivo' in payload) w.giudizioComplessivo = payload.giudizio_complessivo;
        CHARACTERISTIC_FIELDS.forEach(([field]) => { if (field in payload) w[field] = payload[field]; });
        if ('prezzo acquisto' in payload) w.prezzoAcquisto = payload['prezzo acquisto'];
        if ('valore mercato' in payload) w.valoreMercato = payload['valore mercato'];
        if ('nota' in payload) w.nota = payload.nota;
        if ('giudizio_bevitore' in payload) w.giudizioBevitore = payload.giudizio_bevitore;
        rebuildIndexes();
        showToast('Scheda salvata.');
        refreshCurrentViewPreservingScroll();
      } catch (e) {
        showToast('Salvataggio non riuscito: ' + (e.message || e));
      } finally {
        setSaving(false);
      }
    };
    document.getElementById('attachUploadBtn').onclick = async () => {
      const fileInput = document.getElementById('attachFile');
      const statusEl = document.getElementById('attachUploadStatus');
      const files = fileInput.files ? Array.from(fileInput.files) : [];
      if (statusEl) { statusEl.hidden = true; statusEl.textContent = ''; }
      if (!files.length) { showToast('Scegli prima uno o più file PDF.'); return; }
      const categoria = document.getElementById('attachCategoria').value;
      setSaving(true);
      let okCount = 0;
      const errors = [];
      for (const file of files) {
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) { errors.push(`${file.name}: non è un PDF`); continue; }
        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + safeName;
          const { error: upErr } = await sb.storage.from(ATTACH_BUCKET).upload(path, file, { upsert: true, contentType: 'application/pdf' });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from(ATTACH_BUCKET).getPublicUrl(path);
          const row = { id: genId(), wine_id: id, categoria: categoria, filename: file.name, url: pub.publicUrl, uploaded_at: new Date().toISOString() };
          const { error: insErr } = await sb.from('wine_attachments').insert(row);
          if (insErr) throw insErr;
          okCount++;
        } catch (e) {
          errors.push(`${file.name}: ${e.message || e}`);
        }
      }
      fileInput.value = '';
      await refreshAttachList(id);
      setSaving(false);
      if (errors.length) {
        const msg = (okCount ? `${okCount} allegato/i caricato/i. ` : '') + 'Non riusciti: ' + errors.join(' · ');
        if (statusEl) { statusEl.textContent = msg; statusEl.hidden = false; }
        showToast(okCount ? 'Caricamento parziale: alcuni file non sono stati salvati.' : 'Caricamento allegato non riuscito.');
      } else {
        showToast(okCount === 1 ? 'Allegato caricato.' : `${okCount} allegati caricati.`);
      }
    };
    bindRowActions();
    bindDetailStato(id);
    refreshAttachList(id);
    lockDetailPanelForGuests();
  }

  // Nella scheda del vino i clienti (non Admin) possono solo leggere: blocca davvero
  // tutti i campi (sito produttore, prezzi, note, cursori, menu...). La sola regola
  // grafica non basta su mobile, dove toccare l'etichetta attiva comunque il campo.
  // Vale solo per la scheda del vino, non per carrello, accesso o supporto.
  function lockDetailPanelForGuests() {
    if (isAdmin) return;
    const panel = document.querySelector('#overlayRoot .panel.detail');
    if (!panel) return;
    panel.querySelectorAll('input, select, textarea').forEach(el => {
      if (el.type === 'file') return;
      el.disabled = true;
      el.setAttribute('aria-readonly', 'true');
      el.style.opacity = '0.85';
    });
    panel.querySelectorAll('label').forEach(l => { l.style.cursor = 'default'; });
  }

  async function fetchAttachments(wineId) {
    const { data, error } = await sb.from('wine_attachments').select('*').eq('wine_id', wineId).order('uploaded_at', { ascending: true });
    if (error) {
      showToast('Impossibile caricare gli allegati: ' + (error.message || error));
      return [];
    }
    return data || [];
  }

  function attachListHtml(list) {
    if (!list.length) return `<p class="empty-hint">Nessun allegato caricato.</p>`;
    return list.map(a => `
      <div class="attach-item" data-attach-id="${a.id}">
        <span class="attach-badge">${escHtml(a.categoria)}</span>
        <span class="attach-name">${escHtml(a.filename)}</span>
        <div class="attach-actions">
          <a href="${escAttr(a.url)}" target="_blank" rel="noopener" class="attach-link">Vedi</a>
          <a href="${escAttr(a.url)}" download="${escAttr(a.filename)}" class="attach-link">Scarica</a>
          <button class="attach-del" data-attach-id="${a.id}" title="Elimina allegato" aria-label="Elimina allegato">&#128465;</button>
        </div>
      </div>
    `).join('');
  }

  async function refreshAttachList(wineId) {
    const list = await fetchAttachments(wineId);
    const el = document.getElementById('attachList');
    if (!el || detailWineId !== wineId) return; // il pannello potrebbe essere stato chiuso nel frattempo
    el.innerHTML = attachListHtml(list);
    el.querySelectorAll('.attach-del').forEach(btn => {
      btn.onclick = async () => {
        if (!window.confirm('Eliminare questo allegato?')) return;
        setSaving(true);
        try {
          const { error } = await sb.from('wine_attachments').delete().eq('id', btn.dataset.attachId);
          if (error) throw error;
          await refreshAttachList(wineId);
        } catch (e) {
          showToast('Impossibile eliminare l\'allegato: ' + (e.message || e));
        } finally {
          setSaving(false);
        }
      };
    });
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function escAttr(s) {
    return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  // ---- Excel import ----
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function stripAccents(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function normalizeRow(row) {
    const map = {};
    Object.keys(row).forEach(k => {
      const nk = stripAccents(String(k).toLowerCase()).replace(/[^a-z]/g, '');
      map[nk] = row[k];
    });
    const pick = (...keys) => {
      for (const k of keys) { if (map[k] !== undefined && map[k] !== null && map[k] !== '') return map[k]; }
      return null;
    };
    const toNum = (v) => {
      if (v === null || v === undefined || v === '') return null;
      if (typeof v === 'number') return v;
      const n = parseFloat(String(v).replace(',', '.'));
      return isNaN(n) ? null : n;
    };
    const rowLabel = () => {
      const parts = [pick('cantina'), pick('nome') || pick('tipologia') || pick('tipovino') || pick('tipo'), pick('annata')].filter(Boolean);
      return parts.length ? parts.join(' · ') : '(riga senza nome/cantina/annata)';
    };
    const annataRaw = pick('annata');
    const posizioneRaw = pick('posizione');
    const annata = toNum(annataRaw);
    const posizione = normalizeBoxLabel(posizioneRaw) || toNum(posizioneRaw);
    if (annata === null && posizione === null) {
      return { wine: null, reason: `${rowLabel()}: Annata ("${annataRaw ?? ''}") e Posizione ("${posizioneRaw ?? ''}") non valide` };
    }
    if (annata === null) {
      return { wine: null, reason: `${rowLabel()}: Annata non valida ("${annataRaw ?? ''}")` };
    }
    if (posizione === null) {
      return { wine: null, reason: `${rowLabel()}: Posizione non valida ("${posizioneRaw ?? ''}") — usa il formato scaffale.posto (es. 3.4) oppure Box1-Box6` };
    }

    // Colonne dell'Excel:
    //  - nuovo formato: "Tipologia" (es. Barolo), "Caratteristica vino" (Fermo/Bollicine), "Tipo vino" (Secco, Brut...)
    //  - vecchi file: "Tipo Vino" conteneva la tipologia e "Effervescenza" Fermo/Bollicine
    const hasTipologiaCol = Object.prototype.hasOwnProperty.call(map, 'tipologia');
    const tipologia = hasTipologiaCol ? pick('tipologia') : pick('tipovino', 'tipo');
    const tipoVinoNuovo = hasTipologiaCol ? pick('tipovino') : pick('dolcezza');
    const effervescenzaVal = normalizeOption(pick('caratteristicavino', 'effervescenza'), EFFERVESCENZA_OPTIONS);
    const dolcezzaRaw = normalizeDolcezza(tipoVinoNuovo);
    // coerenza: un vino Fermo può essere solo Secco o Dolce (altrimenti il campo resta vuoto)
    const dolcezza = (dolcezzaRaw && dolcezzaOptionsFor(effervescenzaVal).includes(dolcezzaRaw)) ? dolcezzaRaw : null;

    const quantita = toNum(pick('quantita'));
    const dimensione = toNum(pick('dimensione'));
    const grado = toNum(pick('grado'));
    const prezzo = toNum(pick('prezzomedio', 'prezzo'));
    const prezzoAcquisto = toNum(pick('prezzoacquisto'));
    const valoreMercato = toNum(pick('valoremercato'));
    const giudizioComplessivo = toNum(pick('giudiziocomplessivo'));
    const morbidezza = toNum(pick('morbidezza'));
    const struttura = toNum(pick('struttura'));
    const tannicita = toNum(pick('tannicita'));
    const acidita = toNum(pick('acidita'));
    const mineralita = toNum(pick('mineralita'));

    return {
      wine: {
        cantina: pick('cantina'),
        tipo: tipologia,
        nome: pick('nome'),
        annata: Math.round(annata),
        quantita: quantita !== null ? Math.round(quantita) : 1,
        posizione: posizione,
        dimensione: dimensione !== null ? dimensione : 0.75,
        formato: normalizeFormato(pick('formato')),
        grado: grado,
        colore_vino: normalizeOption(pick('colorevino'), COLORE_OPTIONS),
        effervescenza: effervescenzaVal,
        ...(dolcezza ? { dolcezza } : {}),
        paese: normalizeOption(pick('paese'), PAESE_OPTIONS),
        regione: pick('regione'),
        prezzo: prezzo,
        'prezzo acquisto': prezzoAcquisto,
        'valore mercato': valoreMercato,
        disponibile_vendita: parseBoolCell(pick('disponibileallavendita')),
        preferito: parseBoolCell(pick('preferito')),
        bevuto: parseBoolCell(pick('bevuto')),
        data_apertura: parseDateCell(pick('dataapertura')),
        data_fine: parseDateCell(pick('datafine')),
        giudizio_complessivo: giudizioComplessivo !== null ? Math.round(giudizioComplessivo) : null,
        giudizio_bevitore: pick('giudiziobevitore'),
        morbidezza: morbidezza !== null ? Math.round(morbidezza) : null,
        struttura: struttura !== null ? Math.round(struttura) : null,
        tannicita: tannicita !== null ? Math.round(tannicita) : null,
        acidita: acidita !== null ? Math.round(acidita) : null,
        mineralita: mineralita !== null ? Math.round(mineralita) : null,
        nota: pick('nota'),
        sito_produttore: pick('sitoproduttore'),
        immagine_url: pick('fotoetichettaurl'),
      },
      reason: null,
    };
  }

  async function parseExcelFile(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { defval: null });
    const rows = [];
    const rejected = [];
    raw.forEach((r, i) => {
      const { wine, reason } = normalizeRow(r);
      if (wine) rows.push(wine);
      else rejected.push(`Riga ${i + 2} (foglio Excel): ${reason}`);
    });
    return { rows, rejected, totalInFile: raw.length };
  }

  function rejectedListHtml(rejected) {
    if (!rejected || !rejected.length) return '';
    return `
      <div class="detail-section" style="margin-top:14px;">
        <h4>${rejected.length} riga/he scartata/e</h4>
        <ul style="margin:0; padding-left:18px; font-size:0.82rem; color:var(--text-soft); max-height:180px; overflow-y:auto;">
          ${rejected.map(r => `<li style="margin-bottom:4px;">${escHtml(r)}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  function openImportChoice(rows, rejected, totalInFile) {
    const root = document.getElementById('overlayRoot');
    const hasValid = rows.length > 0;
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel">
          <div class="panel-head">
            <h3>${hasValid ? `Importa ${rows.length} bottiglie` : 'Nessuna riga valida'}</h3>
            <button class="close-btn" id="closeImportBtn" aria-label="Chiudi">&times;</button>
          </div>
          <div class="panel-body">
            <p class="sub">Il file contiene ${totalInFile} righe: ${rows.length} valide${rejected.length ? `, ${rejected.length} scartate (vedi sotto)` : ''}.${hasValid ? ' Come vuoi procedere?' : ''}</p>
            ${hasValid ? `
            <div class="import-choice">
              <button class="save-btn" id="importAddBtn">Aggiungi ai vini esistenti</button>
              <button class="confirm-yes" id="importReplaceBtn">Cancella tutto e sostituisci</button>
              <button class="cancel-btn" id="importCancelBtn">Annulla</button>
            </div>
            ` : ''}
            ${rejectedListHtml(rejected)}
          </div>
        </div>
      </div>
    `;
    const close = () => closeOverlay();
    document.getElementById('closeImportBtn').onclick = close;
    if (hasValid) {
      document.getElementById('importCancelBtn').onclick = close;
      document.getElementById('importAddBtn').onclick = () => importRows(rows, { replace: false }, rejected);
      document.getElementById('importReplaceBtn').onclick = () => importRows(rows, { replace: true }, rejected);
    }
    document.getElementById('overlayBg').addEventListener('click', (e) => { if (e.target.id === 'overlayBg') close(); });
  }

  function openImportReport(count, replace, rejected) {
    const root = document.getElementById('overlayRoot');
    root.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="panel">
          <div class="panel-head">
            <h3>Importazione completata</h3>
            <button class="close-btn" id="closeImportReportBtn" aria-label="Chiudi">&times;</button>
          </div>
          <div class="panel-body">
            <p class="sub">${count} bottiglie ${replace ? 'caricate (catalogo sostituito)' : 'aggiunte'}${rejected.length ? `, ${rejected.length} scartate` : ''}.</p>
            ${rejectedListHtml(rejected)}
          </div>
        </div>
      </div>
    `;
    document.getElementById('closeImportReportBtn').onclick = closeOverlay;
    document.getElementById('overlayBg').addEventListener('click', (e) => { if (e.target.id === 'overlayBg') closeOverlay(); });
  }

  async function importRows(rows, opts, rejected) {
    rejected = rejected || [];
    setSaving(true);
    try {
      const { data, error } = await sb.functions.invoke('import-wines', {
        body: { rows, replace: !!opts.replace }
      });
      if (error) throw error;
      if (!data || !data.ok) throw new Error((data && data.error) || 'Importazione non riuscita.');
      await loadWines();
      currentQuery = '';
      go('home');
      render();
      openImportReport(data.count, !!opts.replace, rejected);
    } catch (e) {
      showToast('Importazione non riuscita: ' + (e.message || e));
    } finally {
      setSaving(false);
    }
  }

  // Abbinamento AI: invia alla Edge Function solo la ricetta e i dati descrittivi
  // delle bottiglie disponibili. La chiave del provider resta esclusivamente server-side.
  document.getElementById('app').addEventListener('submit', async e => {
    if (e.target.id !== 'winePairingForm') return;
    e.preventDefault();
    const input = document.getElementById('winePairingDish');
    const resultBox = document.getElementById('winePairingResults');
    const button = e.target.querySelector('button[type="submit"]');
    const dish = (input?.value || '').trim();
    if (!dish) return;
    const candidates = WINES.filter(w => Number(w.quantita || 0) > 0 && !w.bevuto).map((w, i) => ({
      wineId: String(w.id ?? w.wine_id ?? w.idVino ?? `${w.nome || 'vino'}-${i}`),
      nome: w.nome || '', cantina: w.cantina || '', annata: w.annata || '',
      tipo: w.tipo || '', colore: w.coloreVino || '', vitigni: w.vitigni || '',
      regione: w.regione || '', paese: w.paese || '', denominazione: w.denominazione || '',
      dolcezza: w.dolcezza || '', struttura: w.struttura ?? '', acidita: w.acidita ?? '',
      tannino: w.tannino ?? '', alcol: w.gradoVino ?? w.alcol ?? '',
      effervescenza: w.effervescenza || '', descrizione: w.nota || w.descrizione || '',
      quantita: Number(w.quantita || 0)
    }));
    if (!candidates.length) {
      resultBox.innerHTML = '<p class="pairing-note">Non ci sono bottiglie disponibili in cantina da abbinare. Aggiungi o rendi disponibili alcune bottiglie e riprova.</p>';
      return;
    }
    if (button) { button.disabled = true; button.dataset.originalText = button.textContent; button.textContent = 'Sto valutando gli abbinamenti…'; }
    resultBox.innerHTML = '<p class="pairing-note">L’IA sta valutando la ricetta e le bottiglie disponibili nella tua cantina…</p>';
    try {
      const { data, error } = await sb.functions.invoke('wine-pairing-ai', { body: { dish, wines: candidates } });
      if (error) throw error;
      const recommendations = Array.isArray(data?.recommendations) ? data.recommendations : [];
      const byId = new Map(WINES.map((w, i) => [String(w.id ?? w.wine_id ?? w.idVino ?? `${w.nome || 'vino'}-${i}`), w]));
      const matches = recommendations.map(r => ({ wine: byId.get(String(r.wineId)), reason: r.reason || '' })).filter(x => x.wine);
      if (!matches.length) {
        resultBox.innerHTML = `<p class="pairing-note">${escHtml(data?.message || 'Non ho trovato un abbinamento sufficientemente convincente tra le bottiglie disponibili. Prova a descrivere meglio ingredienti, condimenti e metodo di cottura.')}</p>`;
        return;
      }
      resultBox.innerHTML = `<h3>Gli abbinamenti suggeriti dall’IA</h3><p class="pairing-note">Il consiglio considera ingredienti, preparazione, intensità, struttura e caratteristiche dichiarate delle bottiglie disponibili. Le informazioni della cantina possono essere soggettive o incomplete: valuta anche il tuo gusto personale.</p><div class="wine-list">${matches.map(({wine, reason}) => `<div class="pairing-match">${wineRow(wine)}<p class="pairing-note">${escHtml(reason || 'Possibile abbinamento da valutare in base alla preparazione.')}</p></div>`).join('')}</div>`;
      if (typeof bindRowActions === 'function') bindRowActions();
    } catch (err) {
      console.error('AI wine pairing error:', err);
      resultBox.innerHTML = '<p class="pairing-note">Non riesco a contattare il servizio di abbinamento AI. Verifica di aver pubblicato la Edge Function <code>wine-pairing-ai</code> e configurato il segreto <code>OPENAI_API_KEY</code> in Supabase, poi riprova.</p>';
    } finally {
      if (button) { button.disabled = false; button.textContent = button.dataset.originalText || 'Suggerisci il vino'; }
    }
  });

  document.getElementById('navPills').addEventListener('click', e => {
    const btn = e.target.closest('button[data-route]');
    if (btn) go(btn.dataset.route);
  });

  document.getElementById('adminToggleBtn').addEventListener('click', () => {
    if (isAdmin) { adminLogout(); } else { openAdminModal(); }
  });
  document.getElementById('accountBtn').addEventListener('click', () => {
    if (isAnonymousCustomer()) openCustomerAccountModal();
    else if (currentUser && currentUser.email) openCustomerAccountModal();
    else openCustomerLoginModal();
  });

  document.getElementById('cartBtn').addEventListener('click', openCartPanel);
  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
  document.getElementById('notifEmailBtn').addEventListener('click', openNotifEmailModal);
  document.getElementById('msgCenterBtn').addEventListener('click', openMessageCenterModal);
  document.getElementById('supportBtn').addEventListener('click', openSupportModal);

  let searchDebounce = null;
  document.getElementById('searchBox').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => performSearch(val), 150);
  });
  document.getElementById('searchClear').addEventListener('click', () => {
    document.getElementById('searchBox').value = '';
    performSearch('');
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!isAdmin) { showToast('Accedi come Admin per importare dati.'); return; }
    try {
      const { rows, rejected, totalInFile } = await parseExcelFile(file);
      if (!rows.length) {
        if (rejected.length) { openImportChoice(rows, rejected, totalInFile); return; }
        showToast('Nessuna riga valida trovata nel file.');
        return;
      }
      openImportChoice(rows, rejected, totalInFile);
    } catch (err) {
      showToast('Impossibile leggere il file: ' + (err.message || err));
    }
  });

  window.addEventListener('hashchange', render);

  // ---- boot ----
  document.getElementById('app').innerHTML = '<div class="setup-screen"><h2>Caricamento…</h2><p>Sto leggendo il catalogo da Supabase.</p></div>';
  // Ogni nuova apertura del sito deve riproporre l'avviso alla prima modifica in modalità ospite.
  // La scelta precedente vale solo per la visita corrente, non deve restare memorizzata tra le aperture.
  try { localStorage.removeItem(GUEST_HINT_KEY); } catch (e) { /* storage non disponibile */ }

  initUserSession().then(async () => {
    await loadCartFromDb();
    return Promise.all([loadWines(), loadHeroPhoto(), initAdminState(), loadSiteTitle()]);
  }).then(() => { updateCartBadge(); updateSeo(); render(); }).catch(() => {});

  // App installabile: registra il service worker (solo su https)
  if ('serviceWorker' in navigator && /^https:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => { /* ignora */ });
    });
  }
})();

</script>
</body>
</html>
